<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="630" rx="800" ry="200" fill="#0a1628" opacity="0.6"/>
  <g filter="url(#moonGlow)">
    <circle cx="600" cy="280" r="130" fill="#0d1320"/>
    <circle cx="600" cy="280" r="130" fill="url(#moonGrad)" opacity="0.9"/>
    <circle cx="540" cy="230" r="100" fill="#0d1320"/>
  </g>
  <g fill="#fff" opacity="0.8">
    <circle cx="480" cy="180" r="2"/>
    <circle cx="720" cy="200" r="1.5"/>
    <circle cx="450" cy="320" r="1"/>
    <circle cx="750" cy="280" r="1.5"/>
    <circle cx="500" cy="150" r="1"/>
    <circle cx="700" cy="350" r="1"/>
    <circle cx="420" cy="250" r="1.5"/>
    <circle cx="780" cy="220" r="1"/>
  </g>
  <text x="600" y="520" font-family="system-ui,sans-serif" font-size="72" font-weight="900" fill="#00d4ff" text-anchor="middle" letter-spacing="12" filter="url(#glow)">PHASE CITY</text>
  <rect x="500" y="540" width="200" height="3" rx="1.5" fill="#00d4ff" opacity="0.7"/>
</svg>
