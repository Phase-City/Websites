  }

  // ====== FACE FEATURE ESTIMATION ======
  // Measure face width at different heights using skin edge detection
  // Scan rows relative to skin blob, not the expanded box
  var scanX1 = Math.max(0, Math.round(cx - sw * 0.6));
  var scanX2 = Math.min(imgCtx.canvas.width - 1, Math.round(cx + sw * 0.6));
  // Scan rows relative to skin blob top (sb.y1)
  // Lower tolerance for dark skin — less contrast between skin and background
  var edgeTol = skinBr < 120 ? 50 : 70;
  var widthAtEyes = findSkinEdges(scanRow(Math.round(sb.y1 + sh * 0.42), scanX1, scanX2), skinRgb, edgeTol);
  var widthAtCheeks = findSkinEdges(scanRow(Math.round(sb.y1 + sh * 0.5), scanX1, scanX2), skinRgb, edgeTol);
  var widthAtJaw = findSkinEdges(scanRow(Math.round(sb.y1 + sh * 0.75), scanX1, scanX2), skinRgb, edgeTol);
  var widthAtChin = findSkinEdges(scanRow(Math.round(sb.y1 + sh * 0.9), scanX1, scanX2), skinRgb, edgeTol);

  var eyeSpanRaw = widthAtEyes[1] - widthAtEyes[0];
  var cheekSpanRaw = widthAtCheeks[1] - widthAtCheeks[0];
  var jawSpanRaw = widthAtJaw[1] - widthAtJaw[0];
  var chinSpanRaw = widthAtChin[1] - widthAtChin[0];
  // Edge detection fails more on dark skin (low contrast with background)
  var edgeDetectionFailed = (!eyeSpanRaw || !cheekSpanRaw || !jawSpanRaw) && skinBr < 130;
  var eyeSpan = eyeSpanRaw || w * 0.6;
  var cheekSpan = cheekSpanRaw || w * 0.65;
  var jawSpan = jawSpanRaw || w * 0.5;
  var chinSpan = chinSpanRaw || w * 0.3;

  // All face features: wider normalization ranges to avoid maxing out
  // Jaw width: jaw span relative to eye span (avg ~0.78)
  var jawWidth = r2(fc((jawSpan / Math.max(1, eyeSpan) - 0.78) / 0.45));

  // Jaw height: how far skin extends below nose center
  var skinEndY = y2;
  for (var sy = y1 + Math.round(h * 0.7); sy < y2; sy++) {
    var px = imgCtx.getImageData(Math.round(cx), sy, 1, 1).data;
    if (!isSkinLike([px[0], px[1], px[2]], skinRgb, 65)) { skinEndY = sy; break; }
  }
  var jawHeight = r2(fc(((skinEndY - (y1 + h * 0.55)) / (h * 0.45) - 0.7) / 0.5));

  // Jaw shape: squareness
  var jawShape = r2(fc((jawSpan / Math.max(1, cheekSpan) - 0.7) / 0.5));

  // Nose width
  var noseY = y1 + Math.round(h * 0.55);
  var noseRow = scanRow(noseY, x1 + Math.round(w * 0.3), x1 + Math.round(w * 0.7));
  var nosePixels = 0;
  var skinBr = (skinRgb[0] + skinRgb[1] + skinRgb[2]) / 3;
  for (var i = 0; i < noseRow.length; i++) {
    var bright = (noseRow[i][0] + noseRow[i][1] + noseRow[i][2]) / 3;
    if (bright < skinBr * 0.88) nosePixels++;
  }
  var noseWidth = r2(fc((nosePixels / Math.max(1, noseRow.length) - 0.35) / 0.5));

  // Nose length
  var noseShadowStart = -1, noseShadowEnd = -1;
  for (var sy = y1 + Math.round(h * 0.3); sy < y1 + Math.round(h * 0.65); sy++) {
    var px = imgCtx.getImageData(Math.round(cx), sy, 1, 1).data;
    var br = (px[0] + px[1] + px[2]) / 3;
    if (Math.abs(br - skinBr) > 18) {
      if (noseShadowStart === -1) noseShadowStart = sy;
      noseShadowEnd = sy;
    }
  }
  var noseLength = r2(fc(((noseShadowEnd - noseShadowStart) / Math.max(1, h * 0.35) - 0.5) / 0.6));

  // Nose height
  var noseCenter = (noseShadowStart + noseShadowEnd) / 2;
  var noseHeight = r2(fc((0.5 - (noseCenter - y1) / h) / 0.2));

  // Nose bridge
  var bridgeRow = scanRow(y1 + Math.round(h * 0.38), x1 + Math.round(w * 0.4), x1 + Math.round(w * 0.6));
  var bridgePixels = 0;
  for (var i = 0; i < bridgeRow.length; i++) {
    var br = (bridgeRow[i][0] + bridgeRow[i][1] + bridgeRow[i][2]) / 3;
    if (br < skinBr * 0.9) bridgePixels++;
  }
  var noseBridge = r2(fc((bridgePixels / Math.max(1, bridgeRow.length) - 0.25) / 0.5));

  // Nose tip / shift
  var noseTip = r2(noseWidth * 0.25);
  var leftNose = sampleArea(Math.round(cx - w * 0.06), noseY, 3);
  var rightNose = sampleArea(Math.round(cx + w * 0.06), noseY, 3);
  var noseShift = r2(fc(((rightNose[0]+rightNose[1]+rightNose[2]) - (leftNose[0]+leftNose[1]+leftNose[2])) / 120));

  // Cheek width
  var cheekWidth = r2(fc((cheekSpan / Math.max(1, eyeSpan) - 1.0) / 0.35));

  // Cheek bone
  var cheekHighlightL = regionAvgColor(x1 + Math.round(w * 0.12), y1 + Math.round(h * 0.38), x1 + Math.round(w * 0.28), y1 + Math.round(h * 0.48));
  var cheekBone = r2(fc((((cheekHighlightL[0]+cheekHighlightL[1]+cheekHighlightL[2])/3) - skinBr) / 40));

  // Cheek height
  var cheekHeight = r2(cheekBone * 0.3);

  // Chin
  var chinVal = r2(fc((chinSpan / Math.max(1, jawSpan) - 0.5) / 0.6));

  // Brow
  var browRegion = regionAvgColor(x1 + Math.round(w * 0.2), y1 + Math.round(h * 0.2), x1 + Math.round(w * 0.8), y1 + Math.round(h * 0.27));
  var foreheadRegion = regionAvgColor(x1 + Math.round(w * 0.25), y1 + Math.round(h * 0.1), x1 + Math.round(w * 0.75), y1 + Math.round(h * 0.18));
  var browDark = ((foreheadRegion[0]+foreheadRegion[1]+foreheadRegion[2])/3) - ((browRegion[0]+browRegion[1]+browRegion[2])/3);
  var browVal = r2(fc(browDark / 50));

  // Eye openness
  var eyeVar = regionVariance(x1 + Math.round(w * 0.2), y1 + Math.round(h * 0.28), x1 + Math.round(w * 0.8), y1 + Math.round(h * 0.38));
  var eyesVal = r2(fc((eyeVar - 25) / 40));

  // ====== OVERLAY DETECTION ======
  // Much higher thresholds — normal skin has variance 10-25, only detect above that
  // Facial hair: chin/jaw darkness vs cheek skin
  var facialHairDark = regionDarkness(
    x1 + Math.round(w * 0.3), y1 + Math.round(h * 0.7),
    x1 + Math.round(w * 0.7), y1 + Math.round(h * 0.85), skinRgb);
  // Suppress facial hair for female characters; high threshold so normal jaw shadows don't trigger
  // Real facial hair darkens chin 20%+ vs cheeks; normal shadow is 5-15%
  var facialHairVal = currentGender === 'female' ? 0 :
    Math.round(Math.max(0, Math.min(255, (facialHairDark - 0.18) * 200)));

  // Blemishes: cheek color variance (threshold raised significantly)
  var cheekVar = regionVariance(
    x1 + Math.round(w * 0.15), y1 + Math.round(h * 0.4),
    x1 + Math.round(w * 0.4), y1 + Math.round(h * 0.55));
  var blemishVal = Math.round(Math.max(0, Math.min(255, (cheekVar - 28) * 5)));

  // Makeup: hue difference around eyes vs skin (higher threshold)
  var eyeArea = regionAvgColor(x1 + Math.round(w * 0.2), y1 + Math.round(h * 0.27), x1 + Math.round(w * 0.45), y1 + Math.round(h * 0.35));
  var eyeHueDiff = Math.abs(eyeArea[0] - skinRgb[0]) + Math.abs(eyeArea[2] - skinRgb[2]);
  var makeupVal = Math.round(Math.max(0, Math.min(255, (eyeHueDiff - 35) * 4)));

  // Aging: forehead texture (higher threshold)
  var foreheadVar = regionVariance(
    x1 + Math.round(w * 0.25), y1 + Math.round(h * 0.08),
    x1 + Math.round(w * 0.75), y1 + Math.round(h * 0.2));
  var agingVal = Math.round(Math.max(0, Math.min(255, (foreheadVar - 20) * 6)));

  // Complexion: skin uniformity (much higher threshold)
  var skinVar = regionVariance(
    x1 + Math.round(w * 0.2), y1 + Math.round(h * 0.35),
    x1 + Math.round(w * 0.8), y1 + Math.round(h * 0.6));
  var complexionVal = Math.round(Math.max(0, Math.min(255, (skinVar - 18) * 6)));

  // Eyebrow overlay: brow darkness
  var eyebrowVal = Math.round(Math.max(0, Math.min(255, (browDark - 5) * 4)));

  // ====== DEBUG: draw sample points on overlay ======
  var dbgCanvas = document.getElementById('imgOverlay');
  if (dbgCanvas) {
    var dbgCtx = dbgCanvas.getContext('2d');
    var displayCanvas = document.getElementById('imgCanvas');
    var sx = displayCanvas.getBoundingClientRect().width / displayCanvas.width;
    var sy2 = displayCanvas.getBoundingClientRect().height / displayCanvas.height;
    dbgCanvas.width = Math.round(displayCanvas.getBoundingClientRect().width);
    dbgCanvas.height = Math.round(displayCanvas.getBoundingClientRect().height);
    // Draw sample regions as small dots
    var pts = [
      {x: cx, y: (hairTop+hairBot)/2, c: '#ff0', label: 'Hair'},
      {x: cx - sw*0.25, y: cy + sh*0.05, c: '#f80', label: 'Skin L'},
      {x: cx + sw*0.25, y: cy + sh*0.05, c: '#f80', label: 'Skin R'},
      {x: eyeLx, y: eyeCy, c: '#0ff', label: 'Eye L'},
      {x: eyeRx, y: eyeCy, c: '#0ff', label: 'Eye R'},
      {x: cx, y: cy, c: '#f0f', label: 'Center'},
    ];
    for (var p = 0; p < pts.length; p++) {
      var px = pts[p].x * sx, py = pts[p].y * sy2;
      dbgCtx.beginPath();
      dbgCtx.arc(px, py, 4, 0, Math.PI*2);
      dbgCtx.fillStyle = pts[p].c;
      dbgCtx.fill();
      dbgCtx.font = '9px sans-serif';
      dbgCtx.fillText(pts[p].label, px + 6, py + 3);
    }
    // Draw skin edge lines
    var rows = [
      {y: y1 + h*0.33, edges: widthAtEyes, c: 'rgba(0,255,255,0.4)'},
      {y: y1 + h*0.45, edges: widthAtCheeks, c: 'rgba(255,165,0,0.4)'},
      {y: y1 + h*0.72, edges: widthAtJaw, c: 'rgba(128,128,128,0.4)'},
    ];
    for (var r = 0; r < rows.length; r++) {
      if (rows[r].edges[0] >= 0) {
        var ry = rows[r].y * sy2;
        var rlx = (x1 + rows[r].edges[0]) * sx;
        var rrx = (x1 + rows[r].edges[1]) * sx;
        dbgCtx.strokeStyle = rows[r].c;
        dbgCtx.lineWidth = 2;
        dbgCtx.beginPath();
        dbgCtx.moveTo(rlx, ry); dbgCtx.lineTo(rrx, ry);
        dbgCtx.stroke();
      }
    }
  }

  // ====== GENDER DETECTION ======
  var genderScore = 0; // positive = female, negative = male
  var faceBoxRatio = (w * h) / (imgCtx.canvas.width * imgCtx.canvas.height);
  // Completely skip only if face box is huge (>10% of image — full body, not a face)
  var skipGenderDetect = faceBoxRatio > 0.10;
  // Low confidence: blob was unreliable or too large — require stronger signal to commit
  var lowConfidence = window._blobTooLarge || window._blobUnreliableContext;
  // In dark/auto-brightened images, facial feature detection is unreliable
  // Reduce male penalties from face signals (body shape is more reliable)
  var darkScene = autoBrightVal > 30;

  // 1. Jaw taper: female jaws are narrower relative to cheeks
  var jawTaper = jawSpan / Math.max(1, cheekSpan);
  // If jaw > cheeks (ratio > 1.1), edge detection is unreliable (physically impossible)
  if (jawTaper > 1.1) edgeDetectionFailed = true;
  if (!edgeDetectionFailed) {
    if (jawTaper < 0.65) genderScore += 2;      // very tapered = strongly female
    else if (jawTaper < 0.75) genderScore += 1;  // moderately tapered
    else if (jawTaper > 0.85 && !darkScene) genderScore -= 1;  // wide jaw = male (skip in dark)
    else if (jawTaper > 0.95 && !darkScene) genderScore -= 2;  // very wide = strongly male
  }

  // 2. Chin width: females have narrower chins
  var chinTaper = chinSpan / Math.max(1, jawSpan);
  if (chinTaper > 1.1) edgeDetectionFailed = true; // chin wider than jaw = impossible, edge detection noise
  if (!edgeDetectionFailed) {
    if (chinTaper < 0.4) genderScore += 1;  // pointed chin = female
    if (chinTaper > 0.6 && !darkScene) genderScore -= 1;  // wide chin = male (skip in dark)
  }

  // 3. Eyelash darkness: female peds have thick dark lashes above eyes
  // Sample just above the eye line for dark lash pixels
  var lashY = Math.round(sb.y1 + sh * 0.38); // just above eye level (0.42)
  var lashDark = 0, lashTotal = 0;
  for (var lx2 = Math.round(cx - sw * 0.3); lx2 < Math.round(cx + sw * 0.3); lx2 += Math.max(1, Math.round(sw / 30))) {
    if (lx2 >= 0 && lx2 < imgCtx.canvas.width && lashY >= 0 && lashY < imgCtx.canvas.height) {
      var lpd = imgCtx.getImageData(lx2, lashY, 1, 1).data;
      var lBr = (lpd[0] + lpd[1] + lpd[2]) / 3;
      lashTotal++;
      // For dark skin, lashes need less contrast to be detected (dark-on-dark)
      var lashThresh = skinBr < 120 ? skinBr * 0.65 : skinBr * 0.5;
      if (lBr < lashThresh) lashDark++;
    }
  }
  var lashRatio = lashTotal > 0 ? lashDark / lashTotal : 0;
  if (lashRatio > 0.3) genderScore += 2;       // many dark lash pixels = female
  else if (lashRatio > 0.15) genderScore += 1;
  else if (lashRatio < 0.05 && skinBr > 120) genderScore -= 1;  // no lash darkness = male (skip for dark skin)

  // 4. Lip color: females have more vivid/pink lips
  // Use skin blob position (more accurate than expanded box)
  var lipY = Math.round(sb.y1 + sh * 0.75);
  var lipSamples = scanRow(lipY, Math.round(cx - sw * 0.15), Math.round(cx + sw * 0.15));
  var lipPink = 0;
  for (var li2 = 0; li2 < lipSamples.length; li2++) {
    var lr = lipSamples[li2][0], lg = lipSamples[li2][1], lb = lipSamples[li2][2];
    // Pink/red lips: R much higher than G and B, AND distinctly different from skin
    // Adaptive threshold: dark skin has lower absolute R values for pink lips
    var lipMinR = Math.max(skinBr * 0.6, 60);
    var lipSkinDist = colorDist(lipSamples[li2], skinRgb);

  // Scale threshold with skin brightness — dark skin has smaller brightness deltas
  var browThresh = skinBr < 120 ? Math.max(8, skinBr * 0.12) : 15;
  if (browDark > browThresh && !darkScene) genderScore -= 1;  // prominent brow ridge = male (skip in dark)
  if (browDark < 5) genderScore += 1;   // soft brow = female

  // 6. Makeup detection (already computed): strong makeup = likely female
  if (makeupVal > 100) genderScore += 2;
  else if (makeupVal > 50) genderScore += 1;

  // 7. Body shape: scan torso below face for hourglass vs straight figure
  // Female GTA peds have narrow waist + wide hips; males are straight/muscular
  var bodyWaistWidth = 0, bodyChestWidth = 0, bodyHipWidth = 0;
  var bodyTop = y2 + Math.round(h * 0.1); // just below chin
  var bodyMid = Math.min(imgCtx.canvas.height - 1, y2 + Math.round(h * 1.0)); // waist area
  var bodyBot = Math.min(imgCtx.canvas.height - 1, y2 + Math.round(h * 1.8)); // hip area
  var bodyChestY = Math.min(imgCtx.canvas.height - 1, y2 + Math.round(h * 0.5)); // chest
  var bodyScanX1 = Math.max(0, Math.round(cx - w * 1.2));
  var bodyScanX2 = Math.min(imgCtx.canvas.width - 1, Math.round(cx + w * 1.2));

  // Measure body width by expanding outward from center (face X position)
  // Uses brightness change to find silhouette edges
  function measureBodyWidth(scanY) {
    if (scanY < 0 || scanY >= imgCtx.canvas.height) return 0;
    var centerPx = Math.round(cx);
    // Sample center brightness as reference
    var cPd = imgCtx.getImageData(Math.min(imgCtx.canvas.width-1, Math.max(0, centerPx)), scanY, 1, 1).data;
    var centerBr = (cPd[0] + cPd[1] + cPd[2]) / 3;
    if (centerBr < 15) return 0; // center is black = no body here

    // Expand left from center until brightness drops significantly (background edge)
    var leftEdge = centerPx;
    for (var bx = centerPx - 2; bx >= bodyScanX1; bx -= 2) {
      var pd = imgCtx.getImageData(bx, scanY, 1, 1).data;
      var br = (pd[0] + pd[1] + pd[2]) / 3;
      if (br < 20 || Math.abs(br - centerBr) > 80) break; // hit background or major change
      leftEdge = bx;
    }
    // Expand right from center
    var rightEdge = centerPx;
    for (var bx2 = centerPx + 2; bx2 <= bodyScanX2; bx2 += 2) {
      var pd2 = imgCtx.getImageData(bx2, scanY, 1, 1).data;
      var br2 = (pd2[0] + pd2[1] + pd2[2]) / 3;
      if (br2 < 20 || Math.abs(br2 - centerBr) > 80) break;
      rightEdge = bx2;
    }
    return rightEdge - leftEdge;
  }

  bodyChestWidth = measureBodyWidth(bodyChestY);
  bodyWaistWidth = measureBodyWidth(bodyMid);
  bodyHipWidth = measureBodyWidth(bodyBot);

  if (bodyChestWidth > 0 && bodyWaistWidth > 0 && bodyHipWidth > 0) {
    var waistToHip = bodyWaistWidth / Math.max(1, bodyHipWidth);
    var waistToChest = bodyWaistWidth / Math.max(1, bodyChestWidth);

    // Female: narrow waist relative to hips AND/OR chest (hourglass or bust)
    if (waistToHip < 0.75 && waistToChest < 0.85) genderScore += 2; // strong hourglass
    else if (waistToHip < 0.85) genderScore += 1; // moderate hip curve
    if (waistToChest < 0.80) genderScore += 2; // prominent bust (waist much narrower than chest)
    else if (waistToChest < 0.88) genderScore += 1; // moderate bust
    // Male: straight torso (waist similar to hips and chest)
    // Only penalize if body shape was actually measurable (not all-equal or inverted from failed edge detection)
    var bodyEdgeValid = bodyChestWidth !== bodyWaistWidth && waistToChest < 1.3 && waistToHip < 1.3;
    if (waistToHip > 0.92 && waistToChest > 0.90 && bodyEdgeValid) genderScore -= 1;

    console.log('Body shape: chest=' + bodyChestWidth + ' waist=' + bodyWaistWidth + ' hips=' + bodyHipWidth +
      ' w/h=' + waistToHip.toFixed(2) + ' w/c=' + waistToChest.toFixed(2));
  }

  // ====== ENHANCED FACIAL GEOMETRY (signals 8-12) ======
  // These use already-computed face measurements for additional gender signals
  // Only apply when edge detection is reliable (not dark scene, not dark skin edge failures)
  if (!edgeDetectionFailed && !darkScene && eyeSpanRaw && cheekSpanRaw) {
    // 8. Face width-to-height ratio: females have narrower, more oval faces
    var faceWH = sw / Math.max(1, sh);
    if (faceWH < 0.62) genderScore += 1;        // narrow/oval = female
    else if (faceWH > 0.75) genderScore -= 1;   // wide/square = male

    // 9. Forehead proportion: females have proportionally taller foreheads
    // Forehead = top of blob to eye line; face = full blob height
    var foreheadProp = (sh * 0.42) / Math.max(1, sh); // eye line at 42% down
    // We already know eyeSpan; check if forehead is more prominent
    var foreheadWidth = eyeSpanRaw;
    var midFaceWidth = cheekSpanRaw;
    // Female: forehead nearly as wide as cheeks (round face top)
    // Male: forehead wider than cheeks OR more angular
    if (foreheadWidth && midFaceWidth && foreheadWidth > 0) {
      var foreheadRatio = foreheadWidth / midFaceWidth;
      if (foreheadRatio < 0.88) genderScore += 1;  // narrower forehead relative to cheeks = female
    }

    // 10. Lower face proportion: males have longer chin-to-nose area
    var lowerFace = (sh - sh * 0.55) / Math.max(1, sh); // below nose to chin
    if (lowerFace > 0.50) genderScore -= 1;  // long lower face = male
    else if (lowerFace < 0.40) genderScore += 1;  // short lower face = female

    // 11. Nose bridge width: males have wider nose bridges
    if (noseBridge > 0.3) genderScore -= 1;   // wide bridge = male
    else if (noseBridge < -0.2) genderScore += 1; // narrow bridge = female

    // 12. Eye openness: females have taller eye openings (larger eyes)
    if (eyesVal > 0.3) genderScore += 1;   // large open eyes = female
    else if (eyesVal < -0.3) genderScore -= 1; // narrow eyes = male
  }

  // 13. Neck width: scan just below chin for neck thickness
  var neckY = Math.min(imgCtx.canvas.height - 1, Math.round(sb.y2 + sh * 0.05));
  var neckRow = scanRow(neckY, scanX1, scanX2);
  var neckEdges = findSkinEdges(neckRow, skinRgb, edgeTol);
  var neckWidth = neckEdges[1] - neckEdges[0];
  if (neckWidth > 0 && jawSpanRaw > 0) {
    var neckToJaw = neckWidth / jawSpanRaw;
    if (neckToJaw > 0.85) genderScore -= 1;   // thick neck relative to jaw = male
    else if (neckToJaw < 0.60) genderScore += 1; // thin neck = female
  }

  var genderLogSuffix = ' (jawTaper=' + jawTaper.toFixed(2) + ' chinTaper=' + chinTaper.toFixed(2) +
    ' lashRatio=' + lashRatio.toFixed(2) + ' lipPink=' + lipPinkRatio.toFixed(2) +
    ' browDark=' + Math.round(browDark) + ' makeup=' + makeupVal + ')';
  if (skipGenderDetect) {
    console.log('Gender detection: SKIPPED — face box too large (' + (faceBoxRatio*100).toFixed(0) + '% of image)');
  } else if (lowConfidence) {
    // Unreliable context (blob-too-large, creator close-up) — only commit if signal is strong
    // Weak signals (|score| <= 2) are likely UI contamination or noise
    if (genderScore >= 3) {
      console.log('Gender detection: score=' + genderScore + ' → female (low-confidence, strong signal)' + genderLogSuffix);
      setGender('female');
    } else if (genderScore <= -3) {
      console.log('Gender detection: score=' + genderScore + ' → male (low-confidence, strong signal)' + genderLogSuffix);
      setGender('male');
    } else {
      console.log('Gender detection: score=' + genderScore + ' → inconclusive (low-confidence, weak signal |' + Math.abs(genderScore) + '| <= 2)' + genderLogSuffix);
      // Don't override current gender — leave at default or user's previous selection
    }
  } else {
    var detectedGender = genderScore > 0 ? 'female' : 'male';
    console.log('Gender detection: score=' + genderScore + ' → ' + detectedGender + genderLogSuffix);
    setGender(detectedGender);
  }

  // ====== APPLY ALL VALUES ======
  var allValues = {
    'heritage.skinTone': skinToneVal,
    'face.jawWidth': jawWidth, 'face.jawHeight': jawHeight, 'face.jawShape': jawShape,
    'face.noseWidth': noseWidth, 'face.noseHeight': noseHeight, 'face.noseLength': noseLength,
    'face.noseBridge': noseBridge, 'face.noseTip': noseTip, 'face.noseShift': noseShift,
    'face.cheekWidth': cheekWidth, 'face.cheekBone': cheekBone, 'face.cheekHeight': cheekHeight,
    'face.chin': chinVal, 'face.brow': browVal, 'face.eyes': eyesVal,
    'overlays.facialhairStyle': facialHairVal,
    'overlays.blemishesStyle': blemishVal,
    'overlays.eyebrowsStyle': eyebrowVal,
    'overlays.agingStyle': agingVal,
    'overlays.makeupStyle': makeupVal,
    'overlays.complexionStyle': complexionVal,
  };

  for (var key in allValues) {
    var input = document.querySelector('[data-key="' + key + '"]');
    if (input) {
      input.value = allValues[key];
      var span = document.querySelector('[data-val="' + key + '"]');
      if (span) span.textContent = allValues[key];
    }
  }

  // Set color pickers
  var skinInput = document.querySelector('[data-key="heritage.skinTone"]');
  if (skinInput) { skinInput.value = skinToneVal; var s = document.querySelector('[data-val="heritage.skinTone"]'); if (s) s.textContent = skinToneVal; }
  if (bestHair >= 0) {
    setSwatchActive('hc1Grid', 'hair.color1', bestHair);
    window._sampledHairRgb = hairRgb;
  } else {
    window._sampledHairRgb = null;
  }
  if (bestEye >= 0) {
    setSwatchActive('ecGrid', 'hair.eyeColor', bestEye);
    window._sampledEyeRgb = eyeRgb;
  } else {
    window._sampledEyeRgb = null;
  }
  updatePreview();

  // ====== SHOW RESULTS ======
  var el = document.getElementById('faceSelectResults');
  var skinHex = rgbToHex(skinRgb[0], skinRgb[1], skinRgb[2]);
  var hairHex2 = rgbToHex(hairRgb[0], hairRgb[1], hairRgb[2]);
  var eyeHex2 = rgbToHex(eyeRgb[0], eyeRgb[1], eyeRgb[2]);
  if (el) {
    var html = '<div style="font-size:.72rem;margin-bottom:8px;color:var(--success);font-weight:600">Extracted ' + Object.keys(allValues).length + ' values</div>';
    // Colors
    html += '<div style="margin-bottom:6px">';
    html += '<div class="sampler-picked"><span class="color-dot" style="background:'+skinHex+'"></span>Skin Tone → <span class="match">'+skinToneVal+'%</span></div>';
    if (bestHair >= 0) {
      html += '<div class="sampler-picked"><span class="color-dot" style="background:'+hairHex2+'"></span><span class="color-dot" style="background:'+HAIR_HEX[bestHair]+'"></span>Hair → <span class="match">#'+bestHair+'</span></div>';
    } else {
      var hairSkipMsg = hairUnreliable
        ? '🌙 Too dark to detect hair color — use a well-lit screenshot or set manually'
        : '🧢 Hat detected — hair color skipped';
      html += '<div class="sampler-picked" style="color:var(--warn)">' + hairSkipMsg + '</div>';
    }
    if (bestEye >= 0) {
      html += '<div class="sampler-picked"><span class="color-dot" style="background:'+eyeHex2+'"></span><span class="color-dot" style="background:'+EYE_HEX[bestEye]+'"></span>Eyes → <span class="match">'+(EYE_COLORS[bestEye]||bestEye)+'</span></div>';
    } else {
      var eyeSkipMsg;
      if (glassesReason && glassesReason.indexOf('dark image') !== -1) {
        eyeSkipMsg = '🌙 Too dark to detect eye color — use a well-lit screenshot or set manually';
      } else if (glassesReason && glassesReason.indexOf('too large') !== -1) {
        eyeSkipMsg = '📐 Face area too large — draw a tighter box around just the face to detect eye color';
      } else {
        eyeSkipMsg = '🕶 Glasses/obstruction detected — eye color skipped';
      }
      html += '<div class="sampler-picked" style="color:var(--warn)">' + eyeSkipMsg + '</div>';
    }
    html += '</div>';
    // Face features
    var faceKeys = [['Jaw W',jawWidth],['Jaw H',jawHeight],['Jaw Shape',jawShape],['Nose W',noseWidth],['Nose H',noseHeight],['Nose L',noseLength],['Bridge',noseBridge],['Tip',noseTip],['Shift',noseShift],['Cheek W',cheekWidth],['Cheek Bone',cheekBone],['Chin',chinVal],['Brow',browVal],['Eyes',eyesVal]];
    html += '<div style="font-size:.65rem;color:var(--accent);font-weight:700;margin-bottom:3px">FACE FEATURES</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">';
    for (var i = 0; i < faceKeys.length; i++) {

    }

    // Overlays

    html += '<div style="font-size:.65rem;color:var(--accent);font-weight:700;margin-bottom:3px">OVERLAYS</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';

    }
    html += '</div>';
    el.innerHTML = html;
  }
  toast('Face extracted — ' + Object.keys(allValues).length + ' values!');
}

function loadExtractImage(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.getElementById('imgCanvas');
      var wrap = document.getElementById('imgWrap');
      if (!canvas || !wrap) return;
      var maxW = 9999; // full resolution — needed for iris detection
      var scale = Math.min(1, maxW / img.width);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      imgCtx = canvas.getContext('2d', {willReadFrequently: true});
      imgCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
      // Store original pixel data for adjustments
      window._origImageData = imgCtx.getImageData(0, 0, canvas.width, canvas.height);
      window._origImg = img;
      imgLoaded = true;
      wrap.style.display = 'block';
      document.getElementById('imgDrop').style.display = 'none';
      // Show adjustment sliders
      var adj = document.getElementById('imgAdjust');
      if (adj) adj.style.display = 'block';
      // Reset adjustments
      resetAdj('adjBright', 0); resetAdj('adjContrast', 0); resetAdj('adjGamma', 0); resetAdj('adjHue', 0);
      // Store for OCR
      window._ocrImageFile = file;
      // Show eye markers for manual positioning
      showEyeMarkers();
      // Auto-detect face if on Face Select tab
      if (extractTab === 'face') {
        setTimeout(function() { autoDetectFace(); }, 100);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyImgAdjust() {
  if (!window._origImageData || !imgCtx) return;
  var bright = parseInt(document.getElementById('adjBright').value) || 0;
  var contrast = parseInt(document.getElementById('adjContrast').value) || 0;
  var gamma = parseInt(document.getElementById('adjGamma').value) || 0;
  var hue = parseInt(document.getElementById('adjHue').value) || 0;

  // Update value displays
  document.getElementById('adjBrightVal').textContent = bright;
  document.getElementById('adjContrastVal').textContent = contrast;
  document.getElementById('adjGammaVal').textContent = gamma;
  document.getElementById('adjHueVal').textContent = hue;

  var src = window._origImageData.data;
  var canvas = document.getElementById('imgCanvas');
  var out = imgCtx.createImageData(canvas.width, canvas.height);
  var dst = out.data;

  // Precompute brightness/contrast/gamma LUT
  var cFactor = (100 + contrast) / 100;
  cFactor = cFactor * cFactor;
  var gFactor = gamma === 0 ? 1.0 : Math.pow(2, -gamma / 100);
  var lut = new Uint8Array(256);
  for (var i = 0; i < 256; i++) {
    var v = i / 255;
    v = Math.pow(v, gFactor);
    v = (v - 0.5) * cFactor + 0.5;
    v = v + bright / 255;
    lut[i] = Math.max(0, Math.min(255, Math.round(v * 255)));
  }

  var doHue = (hue !== 0);
  var hueRad = hue * Math.PI / 180;
  var cosH = Math.cos(hueRad), sinH = Math.sin(hueRad);

  for (var i = 0; i < src.length; i += 4) {
    var r = lut[src[i]], g = lut[src[i+1]], b = lut[src[i+2]];

    if (doHue) {
      // Hue rotation in YIQ color space (fast)
      var y = 0.299*r + 0.587*g + 0.114*b;
      var ii = 0.596*r - 0.274*g - 0.322*b;
      var q = 0.211*r - 0.523*g + 0.312*b;
      var newI = ii * cosH - q * sinH;
      var newQ = ii * sinH + q * cosH;
      r = Math.max(0, Math.min(255, Math.round(y + 0.956*newI + 0.621*newQ)));
      g = Math.max(0, Math.min(255, Math.round(y - 0.272*newI - 0.647*newQ)));
      b = Math.max(0, Math.min(255, Math.round(y - 1.106*newI + 1.703*newQ)));
    }

    dst[i] = r; dst[i+1] = g; dst[i+2] = b; dst[i+3] = src[i+3];
  }

  imgCtx.putImageData(out, 0, 0);
}

function resetAdj(id, val) {
  var el = document.getElementById(id);

  applyImgAdjust();

// --- Color Sampler ---
function sampleArea(cx, cy, radius) {
  var r = 0, g = 0, b = 0, count = 0;
  cx = Math.round(cx) || 0; cy = Math.round(cy) || 0; radius = Math.round(radius) || 1;
  var canvas = document.getElementById('imgCanvas');
  if (!canvas || !imgCtx || isNaN(cx) || isNaN(cy)) return [128, 128, 128];
  for (var dy = -radius; dy <= radius; dy++) {
    for (var dx = -radius; dx <= radius; dx++) {
      var px = cx + dx, py = cy + dy;
      if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) continue;
      var d = imgCtx.getImageData(px, py, 1, 1).data;
      r += d[0]; g += d[1]; b += d[2]; count++;
    }
  }
  return [Math.round(r/count), Math.round(g/count), Math.round(b/count)];
}

function setSampleMode(mode) {
  samplerMode = mode;
  var btns = document.querySelectorAll('.sampler-mode');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-sample') === mode);
}

function colorDist(a, b) {
  var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
  return Math.sqrt(dr*dr + dg*dg + db*db);
}
function hexToRgb(hex) {
  hex = hex.replace('#','');
  return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
}
function rgbToHex(r,g,b) {
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

  } else if (samplerMode === 'eye') {

    for (var i = 0; i < EYE_HEX.length; i++) { var d = colorDist(rgb, hexToRgb(EYE_HEX[i])); if (d < bestD) { bestD = d; best = i; } }

function fuzzyMatch(text, terms) {
  text = text.toLowerCase().replace(/[^a-z0-9\s.-]/g, '');
  for (var i = 0; i < terms.length; i++) {
    if (text.indexOf(terms[i]) !== -1) return true;
    // Levenshtein-lite: allow 1 char difference for short terms
    if (terms[i].length >= 4) {
      for (var j = 0; j <= text.length - terms[i].length; j++) {
        var sub = text.substr(j, terms[i].length);
        var diff = 0;
        for (var k = 0; k < sub.length; k++) { if (sub[k] !== terms[i][k]) diff++; }
        if (diff <= 1) return true;
      }
    }
  }
  return false;
}

function runOcrScan() {
  if (!window._ocrImageFile) { toast('Upload an image first', 'warn'); return; }
  var status = document.getElementById('ocrStatus');
  var results = document.getElementById('ocrResults');
  status.style.display = 'block';
  status.textContent = 'Loading OCR engine...';
  results.innerHTML = '';

  Tesseract.recognize(window._ocrImageFile, 'eng', {
    logger: function(m) {
      if (m.status === 'recognizing text') status.textContent = 'Scanning... ' + Math.round((m.progress || 0) * 100) + '%';
    }
  }).then(function(result) {
    status.textContent = 'Matching values...';
    var lines = result.data.text.split('\n');
    var found = [];

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      // Extract the last number on the line (value is typically on the right)
      var nums = line.match(/-?\d+\.?\d*/g);
      if (!nums || nums.length === 0) continue;
      var val = nums[nums.length - 1];

      for (var f = 0; f < OCR_FIELD_MAP.length; f++) {
        var field = OCR_FIELD_MAP[f];
        if (fuzzyMatch(line, field[0])) {
          // Avoid duplicate keys (keep first match)
          var dup = false;
          for (var d = 0; d < found.length; d++) { if (found[d].key === field[1]) { dup = true; break; } }
          if (!dup) {
            found.push({
              key: field[1],
              label: field[1].split('.').pop().replace(/([A-Z])/g,' $1').trim(),
              value: val,
              rawLine: line,
              checked: true
            });
          }
          break;
        }
      }
    }

    if (found.length === 0) {
      status.textContent = 'No values found. Try a character creator screenshot with visible labels.';
      setTimeout(function(){ status.style.display = 'none'; }, 4000);
      return;
    }

    status.textContent = 'Found ' + found.length + ' values — check the ones to apply:';
    var html = '';
    for (var i = 0; i < found.length; i++) {
      html += '<div class="ocr-row"><label><input type="checkbox" checked data-ocr-idx="'+i+'"> '+esc(found[i].label)+'</label><span class="ocr-val">'+esc(found[i].value)+'</span></div>';
    }
    html += '<div style="margin-top:8px"><button class="btn btn-sm" onclick="applyOcrResults()">Apply Selected</button></div>';
    results.innerHTML = html;
    window._ocrFound = found;

  }).catch(function(err) {
    status.textContent = 'OCR failed: ' + err.message;
    setTimeout(function(){ status.style.display = 'none'; }, 4000);
  });
}

function applyOcrResults() {
  if (!window._ocrFound) return;
  var count = 0;
  for (var i = 0; i < window._ocrFound.length; i++) {
    var cb = document.querySelector('[data-ocr-idx="'+i+'"]');
    if (!cb || !cb.checked) continue;
    var f = window._ocrFound[i];
    var input = document.querySelector('[data-key="'+f.key+'"]');
    if (input) {
      input.value = f.value;
      var span = document.querySelector('[data-val="'+f.key+'"]');
      if (span) span.textContent = f.value;
      count++;
    }
  }
  updatePreview();
  toast(count + ' values applied!');
  document.getElementById('ocrStatus').textContent = count + ' values applied.';
}

// --- Paste Values ---
// Map from /ped export JSON keys to Phase City data keys
var PED_EXPORT_MAP = {
  // headBlend → heritage
  'shapeFirst': 'heritage.face1Style', 'shapeSecond': 'heritage.face2Style', 'shapeThird': 'heritage.face3Style',
  'skinFirst': 'heritage.face1Texture', 'skinSecond': 'heritage.face2Texture', 'skinThird': 'heritage.face3Texture',
  'shapeMix': 'heritage.faceMix', 'skinMix': 'heritage.skinMix', 'thirdMix': 'heritage.thirdMix',
  // faceFeatures → face
  'noseWidth': 'face.noseWidth', 'nosePeakHeight': 'face.noseHeight', 'nosePeakLength': 'face.noseLength',
  'noseBoneHigh': 'face.noseBridge', 'noseBoneTwist': 'face.noseShift', 'nosePeakLowering': 'face.noseTip',
  'eyeBrowHigh': 'face.brow', 'eyeBrowForward': 'face.brow',
  'cheekBoneHigh': 'face.cheekBone', 'cheekBoneWidth': 'face.cheekWidth', 'cheekWidth': 'face.cheekHeight',
  'jawBoneWidth': 'face.jawWidth', 'jawBoneBackLength': 'face.jawHeight',
  'chinBoneLowering': 'face.chin', 'chinBoneLength': 'face.chin', 'chinBoneWidth': 'face.jawShape',
  'eyeOpenning': 'face.eyes', 'eyeOpening': 'face.eyes',
  'lipThickness': 'face.chin', 'neckThickness': 'face.jawShape',
};

function applyPedExportJson(json) {
  var count = 0, applied = [];
  function setVal(key, val) {
    var input = document.querySelector('[data-key="'+key+'"]');
    if (input) {
      input.value = val;
      var span = document.querySelector('[data-val="'+key+'"]');
      if (span) span.textContent = val;
      applied.push(key.split('.').pop());
      count++;
    }
  }
  // headBlend
  if (json.headBlend) {
    for (var k in json.headBlend) {
      if (PED_EXPORT_MAP[k]) setVal(PED_EXPORT_MAP[k], json.headBlend[k]);
    }
  }
  // faceFeatures (object with named keys or array)
  if (json.faceFeatures) {
    if (Array.isArray(json.faceFeatures)) {
      // Array format: indices 0-19 map to face features
      var ffNames = ['noseWidth','nosePeakHeight','nosePeakLength','noseBoneHigh','noseBoneTwist',
        'eyeBrowHigh','eyeBrowForward','cheekBoneHigh','cheekBoneWidth','cheekWidth',
        'eyeOpenning','lipThickness','jawBoneWidth','jawBoneBackLength',
        'chinBoneLowering','chinBoneLength','chinBoneWidth','chinHole','neckThickness','nosePeakLowering'];
      for (var i = 0; i < json.faceFeatures.length && i < ffNames.length; i++) {
        if (PED_EXPORT_MAP[ffNames[i]]) setVal(PED_EXPORT_MAP[ffNames[i]], json.faceFeatures[i]);
      }
    } else {
      for (var k in json.faceFeatures) {
        if (PED_EXPORT_MAP[k]) setVal(PED_EXPORT_MAP[k], json.faceFeatures[k]);
      }
    }
  }
  // headOverlays
  if (json.headOverlays) {
    var overlayMap = {
      'blemishes': 'overlays.blemishesStyle', 'beard': 'overlays.facialhairStyle',
      'eyebrows': 'overlays.eyebrowsStyle', 'ageing': 'overlays.agingStyle',
      'makeUp': 'overlays.makeupStyle', 'makeup': 'overlays.makeupStyle',
      'blush': 'overlays.blushStyle', 'complexion': 'overlays.complexionStyle',
      'sunDamage': 'overlays.sunDamageStyle', 'lipstick': 'overlays.lipstickStyle',
      'molesFreckles': 'overlays.molesStyle', 'chestHair': 'overlays.chestHairStyle',
    };
    for (var k in json.headOverlays) {
      var ov = json.headOverlays[k];
      if (overlayMap[k] && ov && typeof ov === 'object') {
        if (ov.style != null) setVal(overlayMap[k], ov.style);
      } else if (overlayMap[k] && typeof ov === 'number') {
        setVal(overlayMap[k], ov);
      }
    }
  }
  // hair
  if (json.hair) {
    if (json.hair.style != null) setVal('hair.style', json.hair.style);
    if (json.hair.color != null) setVal('hair.color1', json.hair.color);
    if (json.hair.highlight != null) setVal('hair.color2', json.hair.highlight);
  }
  // eyeColor
  if (json.eyeColor != null) setVal('hair.eyeColor', json.eyeColor);
  // model → gender
  if (json.model) {
    if (json.model.indexOf('_f_') !== -1 || json.model.indexOf('female') !== -1) setGender('female');
    else if (json.model.indexOf('_m_') !== -1 || json.model.indexOf('male') !== -1) setGender('male');
  }
  // skinTone (Phase City format)
  if (json.skinTone != null) setVal('heritage.skinTone', json.skinTone);
  return {count: count, applied: applied};
}

function parsePastedValues() {
  var text = document.getElementById('pasteArea').value.trim();
  if (!text) return;

  // Try JSON parse first (/ped export or Phase City soul JSON)
  try {
    var json = JSON.parse(text);
    if (typeof json === 'object' && json !== null) {
      // Check if it's a Phase City soul format
      if (json.heritage || json.face || json.hair) {
        // Phase City format — apply directly
        var count = 0, applied = [];
        function setFromObj(prefix, obj) {
          if (!obj || typeof obj !== 'object') return;
          for (var k in obj) {
            var key = prefix + '.' + k;
            var input = document.querySelector('[data-key="'+key+'"]');
            if (input) {
              input.value = obj[k];
              var span = document.querySelector('[data-val="'+key+'"]');
              if (span) span.textContent = obj[k];
              applied.push(k);
              count++;
            }
          }
        }
        setFromObj('heritage', json.heritage);
        setFromObj('face', json.face);
        setFromObj('hair', json.hair);
        setFromObj('overlays', json.overlays);
        if (json.gender) setGender(json.gender);
        updatePreview();
        var el = document.getElementById('pasteResults');
        el.innerHTML = '<div style="font-size:.75rem;color:var(--success)">Applied ' + count + ' values from Phase City JSON: ' + applied.join(', ') + '</div>';
        toast(count + ' values applied from JSON!');
        return;
      }
      // /ped export format (headBlend, faceFeatures, etc.)
      if (json.headBlend || json.faceFeatures || json.headOverlays || json.model) {
        var result = applyPedExportJson(json);
        updatePreview();
        var el = document.getElementById('pasteResults');
        if (result.count > 0) {
          el.innerHTML = '<div style="font-size:.75rem;color:var(--success)">Applied ' + result.count + ' values from /ped export: ' + result.applied.join(', ') + '</div>';
          toast(result.count + ' values applied from /ped export!');
        } else {
          el.innerHTML = '<div style="font-size:.75rem;color:var(--error)">JSON detected but no matching values found</div>';
        }
        return;
      }
    }
  } catch(e) { /* not JSON, fall through to text parsing */ }

  // Text format: "Nose Width: 0.5" lines
  var lines = text.split('\n');
  var count = 0;
  var applied = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var nums = line.match(/-?\d+\.?\d*/g);
    if (!nums || nums.length === 0) continue;
    var val = nums[nums.length - 1];

    for (var f = 0; f < OCR_FIELD_MAP.length; f++) {
      var field = OCR_FIELD_MAP[f];
      if (fuzzyMatch(line, field[0])) {
        var input = document.querySelector('[data-key="'+field[1]+'"]');
        if (input) {
          input.value = val;
          var span = document.querySelector('[data-val="'+field[1]+'"]');
          if (span) span.textContent = val;
          applied.push(field[1].split('.').pop());
          count++;
        }
        break;
      }
    }
  }

  updatePreview();
  var el = document.getElementById('pasteResults');
  if (count > 0) {
    el.innerHTML = '<div style="font-size:.75rem;color:var(--success)">Applied ' + count + ' values: ' + applied.join(', ') + '</div>';
    toast(count + ' values applied!');
  } else {
    el.innerHTML = '<div style="font-size:.75rem;color:var(--error)">No matching values found. Paste a /ped export JSON, Phase City soul JSON, or text like "Nose Width: 0.5"</div>';
  }
}
