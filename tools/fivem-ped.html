<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05020f;--surface:#12121a;--border:#1e1e2e;--text:#e0e0e0;--muted:#888;--accent:#7B68EE;--cyan:#5CE1E6;--error:#ff4757;--success:#2ed573;--warn:#ffa502}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;padding:76px 20px 20px}
.container{max-width:920px;margin:0 auto}
h1{text-align:center;font-size:1.6rem;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:1px}
.subtitle{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:24px}
.top-bar{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.75rem;border-radius:4px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--error)}
.btn-cyan{background:var(--cyan);color:#000}

/* Card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.soul-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;transition:all .15s;display:flex;flex-direction:column}
.soul-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(123,104,238,.1)}
.soul-card .name{font-size:1.15rem;font-weight:700;margin-bottom:6px;text-align:center}
.soul-card .info{font-size:.74rem;color:var(--muted);line-height:1.7;margin-bottom:auto}
.soul-card .info .stat{display:flex;justify-content:space-between;padding:1px 0}
.soul-card .info .stat .sl{color:var(--muted)}
.soul-card .info .stat .sv{color:var(--text);font-weight:600;font-family:'Courier New',monospace;font-size:.72rem}
.soul-card .actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.add-card{background:transparent;border:2px dashed var(--border);border-radius:8px;padding:32px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:all .15s;color:var(--muted);font-size:.85rem}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.add-card .plus{font-size:2rem;line-height:1}

/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:10px;width:100%;max-width:1140px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
.modal h2{font-size:1.1rem;color:var(--accent);margin-bottom:12px;text-align:center}
.modal-top{padding:18px 24px 0;flex-shrink:0}
.modal-split{display:flex;flex:1;min-height:0;overflow:hidden}
.modal-form{flex:1;overflow-y:auto;padding:10px 24px 24px;min-width:0}
.modal-preview{width:340px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:16px;background:var(--surface)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--border);flex-shrink:0}

/* Form fields */
.field-group{margin-bottom:4px}
.field-group label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.field-group input[type="text"],.field-group input[type="number"]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-size:.85rem;font-family:inherit}
.field-group input:focus{outline:none;border-color:var(--accent)}

/* Slider rows */
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.slider-row label{font-size:.7rem;color:var(--muted);min-width:70px;text-transform:uppercase;letter-spacing:.3px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:var(--border);border-radius:3px;outline:none;cursor:pointer}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 4px rgba(123,104,238,.4)}
.slider-row input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.slider-row .slider-val{min-width:36px;text-align:right;font-size:.78rem;font-weight:600;color:var(--text);font-family:'Courier New',monospace}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}

/* Sections */
.section{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s;font-size:.85rem;font-weight:600;color:var(--accent)}
.section-header:hover{background:rgba(123,104,238,.05)}
.section-header .arrow{color:var(--muted);font-size:.6rem;transition:transform .2s}
.section.collapsed .section-body{display:none}
.section.collapsed .arrow{transform:rotate(-90deg)}
.section-body{padding:8px 14px 14px}
.sub-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;opacity:.7}

/* Preview */
.preview-face{text-align:center;margin-bottom:16px}
.preview-section{margin-bottom:12px}
.preview-section-title{font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.preview-row{display:flex;justify-content:space-between;font-size:.72rem;padding:2px 0}
.preview-row .lbl{color:var(--muted)}
.preview-row .val{color:var(--text);font-weight:600;font-family:'Courier New',monospace}
.preview-row .val.empty{color:#333}
.preview-name{text-align:center;font-size:1rem;font-weight:700;margin-bottom:12px;word-break:break-word}

/* Color picker swatches */
.swatch-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 4px;display:flex;align-items:center;gap:8px}
.swatch-label .swatch-val{font-family:'Courier New',monospace;color:var(--text);font-weight:600}
.swatch-grid{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.swatch{width:22px;height:22px;border-radius:4px;border:2px solid transparent;cursor:pointer;transition:all .12s}
.swatch:hover{transform:scale(1.2);z-index:1}
.swatch.active{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.4);transform:scale(1.15)}

/* Extract section */
.extract-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--border)}
.extract-tab{padding:7px 14px;font-size:.72rem;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.extract-tab:hover{color:var(--text)}
.extract-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.extract-panel{display:none}
.extract-panel.active{display:block}
.img-drop{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;color:var(--muted);font-size:.82rem;cursor:pointer;transition:all .15s;margin-bottom:10px}
.img-drop:hover,.img-drop.dragover{border-color:var(--accent);color:var(--accent)}
.img-drop input{display:none}
.img-canvas-wrap{position:relative;margin-bottom:10px;border-radius:6px;overflow:hidden;display:none;border:1px solid var(--border)}
.img-canvas-wrap canvas#imgCanvas{display:block;width:100%;cursor:crosshair}
.img-canvas-wrap canvas#imgOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.face-marker{position:absolute;width:32px;height:32px;cursor:grab;z-index:4;transform:translate(-50%,-50%);user-select:none;display:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7)) drop-shadow(0 0 3px rgba(0,0,0,.5))}
.face-marker.visible{display:block}
.marker-ring{width:32px;height:32px;border:2.5px solid #5CE1E6;border-radius:50%;box-shadow:0 0 12px rgba(92,225,230,.6),inset 0 0 6px rgba(92,225,230,.2);position:relative}
.marker-ring::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;background:#5CE1E6;border-radius:50%;transform:translate(-50%,-50%)}
.marker-ring.eye{border-color:#5CE1E6;box-shadow:0 0 8px rgba(92,225,230,.5)}
.marker-ring.eye::after{background:#5CE1E6}
.marker-ring.hair{border-color:#ffa502;box-shadow:0 0 8px rgba(255,165,2,.5)}
.marker-ring.hair::after{background:#ffa502}
.marker-ring.skin{border-color:#f0a050;box-shadow:0 0 8px rgba(240,160,80,.5)}
.marker-ring.skin::after{background:#f0a050}
.marker-label{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:inherit;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap}
.eye-marker .marker-label{color:#5CE1E6}
#hairMarker .marker-label{color:#ffa502}
#skinMarkerL .marker-label,#skinMarkerR .marker-label{color:#f0a050}
.face-marker:active{cursor:grabbing}
.marker-ring:hover{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
.sampler-modes{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sampler-mode{padding:5px 10px;font-size:.72rem;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.sampler-mode:hover{border-color:var(--accent);color:var(--accent)}
.sampler-mode.active{border-color:var(--accent);background:rgba(123,104,238,.15);color:var(--accent);font-weight:600}
.sampler-picked{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:6px}
.sampler-picked .color-dot{width:20px;height:20px;border-radius:4px;border:1px solid #444}
.sampler-picked .match{color:var(--text);font-weight:600}
.extract-hint{font-size:.68rem;color:var(--muted);text-align:center;opacity:.7;margin-top:4px}
.ocr-status{font-size:.75rem;color:var(--cyan);text-align:center;margin:8px 0;display:none}
.ocr-results{margin-top:8px}
.ocr-row{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:.75rem;border-radius:4px;margin-bottom:2px;background:rgba(123,104,238,.05)}
.ocr-row label{display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;color:var(--muted)}
.ocr-row .ocr-val{color:var(--text);font-weight:600;font-family:'Courier New',monospace;margin-left:auto}
.ocr-row input[type="checkbox"]{accent-color:var(--accent)}
.img-adjust{display:none;margin-bottom:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.img-adjust .adj-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.img-adjust .adj-row:last-child{margin-bottom:0}
.img-adjust label{font-size:.68rem;color:var(--muted);min-width:55px;text-transform:uppercase}
.img-adjust input[type="range"]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:2px;outline:none}
.img-adjust input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
.img-adjust .adj-val{min-width:28px;text-align:right;font-size:.7rem;color:var(--text);font-family:'Courier New',monospace}
.img-adjust .adj-reset{font-size:.65rem;color:var(--muted);cursor:pointer;border:none;background:none;padding:2px 4px}
.img-adjust .adj-reset:hover{color:var(--accent)}
.paste-area{width:100%;min-height:100px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;color:var(--text);font-size:.78rem;font-family:'Courier New',monospace;resize:vertical;margin-bottom:8px}

/* Import */
.modal-import{max-width:480px;display:flex;flex-direction:column}
.modal-import .modal-body{padding:24px}
.import-area{width:100%;min-height:80px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;color:var(--text);font-size:.8rem;font-family:'Courier New',monospace;resize:vertical}

.gender-btn{padding:8px 20px;font-size:.9rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.3px}
.gender-btn.active{background:var(--accent);color:#fff}
.gender-btn:hover:not(.active){background:rgba(123,104,238,.2);color:var(--accent)}
.toast{position:fixed;bottom:30px;right:30px;left:30px;max-width:600px;margin:0 auto;padding:20px 32px;border-radius:12px;font-size:1.3rem;font-weight:800;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 30px rgba(0,0,0,.5);letter-spacing:.4px;text-align:center;background:var(--success);color:#000}
.toast.toast-warn{background:var(--warn);color:#000}
.toast.toast-error{background:var(--error);color:#fff}
.toast.toast-info{background:var(--accent);color:#fff}
.toast.show{opacity:1}

@media(max-width:720px){
  .modal-split{flex-direction:column-reverse}
  .modal-preview{width:100%;border-left:none;border-bottom:1px solid var(--border);max-height:280px}
  .modal{max-height:95vh}
  .form-grid{grid-template-columns:1fr}
}

::selection{background:#8b5cf666;color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#05020f}
::-webkit-scrollbar-thumb{background:#8b5cf64d;border-radius:3px}
@keyframes twinkle{0%,to{opacity:0}50%{opacity:.7}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) var(--dl) ease-in-out infinite;will-change:opacity;contain:strict}
.tool-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:#05020fe0;backdrop-filter:blur(24px);border-bottom:1px solid rgba(139,92,246,.1);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,32px)}
.tool-nav .n-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.tool-nav .n-logo img{width:22px;height:20px;filter:drop-shadow(0 0 8px rgba(139,92,246,.4))}
.tool-nav .n-logo span{font-family:Syne,sans-serif;font-weight:800;font-size:15px;letter-spacing:.05em}
.tool-nav .n-logo .ac{color:#8b5cf6}
.tool-nav .n-links{display:flex;gap:4px}
.tool-nav .n-links a{color:#6b6b87;font-size:12px;font-weight:500;padding:5px 12px;border-radius:5px;border:1px solid transparent;transition:.3s;text-decoration:none}
.tool-nav .n-links a:hover{background:#8b5cf61f;border-color:#8b5cf640;color:#c4b5fd}
.tool-footer{padding:36px 24px;text-align:center;border-top:1px solid rgba(139,92,246,.06);position:relative;z-index:1;margin-top:40px}
.tool-footer .fl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.tool-footer .fl span{font-family:Syne,sans-serif;font-weight:700;font-size:12px;color:#6b6b87}
.tool-footer .fl .ac{color:#8b5cf673}
.tool-footer .cp{font-family:'JetBrains Mono',monospace;font-size:10px;color:#3d3d54;letter-spacing:.1em}
@media(max-width:640px){.tool-nav .n-links{display:none}}
@media(prefers-reduced-motion:reduce){.star{animation:none!important}}
.n-logo span{font-family:Orbitron,sans-serif!important;letter-spacing:.08em!important}
.tool-nav a[href*="store"]{background:linear-gradient(135deg,#38bdf8,#8b5cf6)!important;border:1px solid rgba(196,181,253,.25)!important;color:#031021!important;text-shadow:0 1px 0 rgba(255,255,255,.2);box-shadow:0 0 22px #8b5cf652;font-weight:700!important;transition:box-shadow .2s,transform .15s}
.tool-nav a[href*="store"]:hover{box-shadow:0 0 36px #8b5cf685!important;transform:translateY(-1px)!important;color:#031021!important}
.tool-nav{gap:10px}
.tool-nav .n-links{margin-left:auto}
.live-strip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border:1px solid rgba(16,185,129,.4);border-radius:50px;background:rgba(16,185,129,.07);text-decoration:none;color:#10b981;font-family:Orbitron,monospace;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;transition:all .25s;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden}
.live-strip .live-text{overflow:hidden;text-overflow:ellipsis}
.live-strip:hover{border-color:rgba(16,185,129,.75);box-shadow:0 0 18px rgba(16,185,129,.22);color:#34d399}
.live-strip[data-cfx-empty="1"]{opacity:.55}
.live-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 10px #10b981;animation:livePulse 1.6s ease-in-out infinite;flex-shrink:0}
@keyframes livePulse{0%,to{opacity:1}50%{opacity:.35}}
@media(max-width:900px){.live-strip{display:none}}
</style>
</head>

(typeof requestIdleCallback==='function'?requestIdleCallback:setTimeout)(function(){var e=document.getElementById('stars'),t=document.createDocumentFragment(),n=window.innerWidth<640?40:80;for(var s=0;s<n;s++){var o=document.createElement('div');o.className='star';var c=Math.random()*2+.5;o.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+c+'px;height:'+c+'px;--d:'+(Math.random()*3+2)+'s;--dl:'+Math.random()*4+'s';t.appendChild(o)}e.appendChild(t)});

<div class="container">
  <h1>PED BUILDER</h1>
  <p class="subtitle"><a href="/" style="color:inherit;text-decoration:none">Phase City</a> — Save & manage your character creator values</p>
  <div class="top-bar" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <button class="btn btn-sm" onclick="newSoul()">+ New Soul</button>
    <button class="btn btn-sm" onclick="newCity()">+ New City</button>
    <button class="btn btn-sm" style="background:var(--success);color:#000" onclick="saveCityJson()">Save City</button>
    <button class="btn btn-sm" style="background:var(--warn);color:#000" onclick="openLoadCity()">Load City</button>
    <span id="cityLabel" style="display:none"></span>
  </div>
  <div id="searchBar" style="display:none;margin-bottom:12px">
    <input type="text" id="soulSearch" placeholder="Search souls by name..." oninput="filterSouls()" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
  </div>
  <div class="grid" id="soulGrid"></div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-top">
      <h2 id="modalTitle">New Soul</h2>
      <div id="modalCityLabel" style="font-size:.75rem;color:var(--muted);margin-bottom:4px"></div>
      <div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-end">
        <div class="field-group" style="flex:1;margin-bottom:0">
          <label>Soul Name</label>
          <input type="text" id="soulName" placeholder="e.g. Johnny Rivera" oninput="updatePreview()">
        </div>
        <div class="field-group" style="margin-bottom:0">

// --- Build slider HTML ---
function makeSlider(label, key, min, max, step, val) {
  var v = val != null ? val : '';
  var display = v !== '' ? v : '—';
  return '<div class="slider-row">' +
    '<label>' + label + '</label>' +
    '<input type="range" data-key="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + (v !== '' ? v : ((min + max) / 2)) + '" oninput="onSlider(this)">' +
    '<span class="slider-val" data-val="' + key + '">' + display + '</span>' +
  '</div>';
}

function makeOverlaySlider(name, key) {
  return '<div class="slider-row">' +
    '<label>' + name + '</label>' +
    '<input type="range" data-key="overlays.' + key + 'Style" min="0" max="255" step="1" value="0" oninput="onSlider(this)">' +
    '<span class="slider-val" data-val="overlays.' + key + 'Style">0</span>' +
  '</div>';

function pickColor(el) {
  var key = el.getAttribute('data-picker');
  var idx = parseInt(el.getAttribute('data-idx'));
  // Set hidden input
  var input = document.querySelector('[data-key="' + key + '"]');
  if (input) input.value = idx;
  // Update active swatch in this grid
  var grid = el.parentElement;
  var prev = grid.querySelector('.swatch.active');
  if (prev) prev.classList.remove('active');
  el.classList.add('active');
  // Update label
  if (key === 'hair.color1') document.getElementById('hc1Val').textContent = idx;
  else if (key === 'hair.color2') document.getElementById('hc2Val').textContent = idx;
  else if (key === 'hair.eyeColor') document.getElementById('ecVal').textContent = idx + ' — ' + (EYE_COLORS[idx] || idx);
  updatePreview();
}

function setSwatchActive(gridId, key, idx) {
  var grid = document.getElementById(gridId);
  if (!grid) return;
  var prev = grid.querySelector('.swatch.active');
  if (prev) prev.classList.remove('active');
  var target = grid.querySelector('[data-idx="' + idx + '"]');
  if (target) target.classList.add('active');
  var input = document.querySelector('[data-key="' + key + '"]');
  if (input) input.value = idx;
  if (key === 'hair.color1') { var el = document.getElementById('hc1Val'); if (el) el.textContent = idx; }
  else if (key === 'hair.color2') { var el = document.getElementById('hc2Val'); if (el) el.textContent = idx; }
  else if (key === 'hair.eyeColor') { var el = document.getElementById('ecVal'); if (el) el.textContent = idx + ' — ' + (EYE_COLORS[idx] || idx); }
}

function onSlider(el) {
  var key = el.getAttribute('data-key');
  // Find the value display span — try next sibling first (faster), fallback to querySelector
  var span = el.nextElementSibling;
  if (!span || span.getAttribute('data-val') !== key) {
    span = document.querySelector('[data-val="' + key + '"]');
  }
  if (span) span.textContent = el.value;
  updatePreview();
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

// --- Modal open/close ---
function openModal(soul, index) {
  editingIndex = index;
  document.getElementById('modalTitle').textContent = index === -1 ? 'New Soul' : 'Edit Soul';
  var mcl = document.getElementById('modalCityLabel');
  if (mcl) mcl.textContent = _currentCityName ? 'City: ' + _currentCityName : '';
  document.getElementById('soulName').value = soul.name || '';

  // Reset extract/image state for fresh start
  resetExtractState();

  // Set gender
  setGender(soul.gender || 'male');

  // Set slider values from soul data
  var inputs = document.querySelectorAll('[data-key]');
  for (var i = 0; i < inputs.length; i++) {
    var keys = inputs[i].getAttribute('data-key').split('.');
    var val = soul;
    for (var k = 0; k < keys.length; k++) val = val && val[keys[k]];

    if (val != null) {
      inputs[i].value = val;
      var span = document.querySelector('[data-val="' + inputs[i].getAttribute('data-key') + '"]');
      if (span) span.textContent = val;
    } else if (inputs[i].type === 'range') {
      // Reset defaults: face features to 0 (midpoint of -1..1),
      // skin tone to 50, mix sliders to 0.5, index sliders to 0
      var min = parseFloat(inputs[i].min);
      var max = parseFloat(inputs[i].max);
      var key = inputs[i].getAttribute('data-key');
      var def;
      if (min < 0) def = 0; // face features: -1 to 1, default 0
      else if (key === 'heritage.skinTone') def = 50; // skin tone default to medium
      else if (key && key.indexOf('Mix') !== -1) def = 0.5; // mix sliders default to 0.5
      else def = min; // index sliders default to min (0)
      inputs[i].value = def;
      var span = document.querySelector('[data-val="' + inputs[i].getAttribute('data-key') + '"]');
      if (span) span.textContent = def;
    } else if (inputs[i].type === 'hidden') {
      // Overlay opacity defaults to 1
      inputs[i].value = 1;
    }
  }

  // Set color swatch pickers
  var hc1 = soul.hair && soul.hair.color1 != null ? soul.hair.color1 : 0;
  var hc2 = soul.hair && soul.hair.color2 != null ? soul.hair.color2 : 0;
  var ec = soul.hair && soul.hair.eyeColor != null ? soul.hair.eyeColor : 0;
  setSwatchActive('hc1Grid', 'hair.color1', hc1);
  setSwatchActive('hc2Grid', 'hair.color2', hc2);
  setSwatchActive('ecGrid', 'hair.eyeColor', ec);

  document.getElementById('editModal').classList.add('open');
  updatePreview();
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

var currentGender = 'male';
function setGender(g) {
  currentGender = g;
  var btns = document.querySelectorAll('.gender-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-gender') === g);
  updatePreview();
}

function collectFormData() {
  var soul = { name: document.getElementById('soulName').value.trim() || 'Unnamed Soul', gender: currentGender };
  var inputs = document.querySelectorAll('[data-key]');
  for (var i = 0; i < inputs.length; i++) {
    var keys = inputs[i].getAttribute('data-key').split('.');
    var val = inputs[i].value;
    if (val === '') continue;
    val = parseFloat(val);
    if (isNaN(val)) continue;
    var obj = soul;
    for (var k = 0; k < keys.length - 1; k++) {
      if (!obj[keys[k]]) obj[keys[k]] = {};
      obj = obj[keys[k]];
    }
    obj[keys[keys.length - 1]] = val;
  }
  return soul;
}

function newCity() {
  var name = prompt('City name:');
  if (!name || !name.trim()) return;
  name = name.trim();
  _currentCityName = name;
  // Don't add duplicate
  if (!_knownCities.find(function(c) { return c.name === name; })) {
    _knownCities.push({ name: name, fileHandle: null });
  }
  setSouls([]);
  updateCityLabel();
  render();
  toast('City "' + name + '" created — add souls and save to JSON');
}

function updateCityLabel() {
  var el = document.getElementById('cityLabel');
  if (el) el.textContent = _currentCityName || '';
}

function newSoul() {
  if (!_currentCityName) {
    toast('Create a city first before adding souls', 'warn');
    newCity();
    if (!_currentCityName) return; // user cancelled the prompt
  }
  openModal({}, -1);
}
function editSoul(i) { openModal(getSouls()[i], i); }

function saveSoul() {
  var soul = collectFormData();
  var souls = getSouls();
  if (editingIndex === -1) souls.push(soul);
  else souls[editingIndex] = soul;
  setSouls(souls);
  closeModal();
  render();
  toast('Soul saved!');
}

function deleteSoul(i) {
  if (!confirm('Delete this soul?')) return;
  var souls = getSouls(); souls.splice(i, 1); setSouls(souls); render(); toast('Soul deleted');
}

async function transferSoul(i) {
  var soul = getSouls()[i];
  // Build list of other cities
  var others = _knownCities.filter(function(c) { return c.name !== _currentCityName; });
  if (others.length === 0) { toast('No other cities loaded to transfer to', 'warn'); return; }

  // If only one other city, transfer directly; otherwise ask
  var dest;
  if (others.length === 1) {
    dest = others[0];
    if (!confirm('Transfer "' + (soul.name || 'Unnamed') + '" to ' + dest.name + '?')) return;
  } else {
    var choices = others.map(function(c, idx) { return (idx + 1) + '. ' + c.name; }).join('\n');
    var pick = prompt('Transfer "' + (soul.name || 'Unnamed') + '" to which city?\n\n' + choices + '\n\nEnter number:');
    if (!pick) return;
    var pickIdx = parseInt(pick) - 1;
    if (pickIdx < 0 || pickIdx >= others.length) { toast('Invalid selection', 'error'); return; }
    dest = others[pickIdx];
  }

  try {
    // Read destination city file
    var file = await dest.fileHandle.getFile();
    var raw = await file.text();
    var data = JSON.parse(raw);

    var destSouls;
    if (Array.isArray(data)) { destSouls = data; }
    else if (data.souls && Array.isArray(data.souls)) { destSouls = data.souls; }
    else { toast('Invalid city JSON', 'error'); return; }

    // Add soul to destination
    if (!soul.gender) soul.gender = 'male';
    destSouls.push(soul);

    // Write back
    var destData = Array.isArray(data) ? destSouls
      : Object.assign({}, data, { souls: destSouls, exportedAt: new Date().toISOString() });
    var writable = await dest.fileHandle.createWritable();
    await writable.write(JSON.stringify(destData, null, 2));
    await writable.close();

    // Remove from current city
    var souls = getSouls();
    souls.splice(i, 1);
    setSouls(souls);
    render();
    toast('"' + (soul.name || 'Soul') + '" transferred to ' + dest.name + '!');
  } catch (e) {
    if (e.name === 'AbortError') return;
    toast('Transfer failed: ' + e.message, 'error');
  }
}

async function saveSoulToFile(i) {
  var soul = getSouls()[i];
  var json = JSON.stringify(soul, null, 2);
  var fileName = (soul.name || 'soul').replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.json';

  if (window.showSaveFilePicker) {
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }]
      });
      var writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      toast('Soul saved to file!');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  // Fallback: download
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Soul downloaded!');
}

async function loadSoulFromFile() {
  if (window.showOpenFilePicker) {
    try {
      var handles = await window.showOpenFilePicker({
        types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }],
        multiple: false
      });
      var file = await handles[0].getFile();
      var raw = await file.text();
      var soul = JSON.parse(raw);
      if (typeof soul !== 'object' || !soul) throw new Error('Invalid');
      if (!soul.name) soul.name = file.name.replace('.json', '');
      var souls = getSouls(); souls.push(soul); setSouls(souls);
      render(); toast('Soul loaded from file!');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (e.message !== 'Invalid') { alert('Invalid soul JSON: ' + e.message); return; }
    }
  }
  // Fallback: use paste modal
  openLoadSoul();
}

// --- Grid ---
function cardFaceSvg(s) {
  var st = (s.heritage && s.heritage.skinTone != null ? s.heritage.skinTone : 50) / 100;
  // Non-linear: push midtones lighter so 50% looks caucasian, not brown
  var t = Math.pow(st, 0.7); // gamma curve makes 50% → ~62%
  var sR = Math.min(255, Math.round(80 + t * 175));
  var sG = Math.min(255, Math.round(55 + t * 165));
  var sB = Math.min(255, Math.round(40 + t * 145));
  var skinC = 'rgb('+sR+','+sG+','+sB+')';
  var skinD = 'rgb('+Math.round(sR*.8)+','+Math.round(sG*.8)+','+Math.round(sB*.8)+')';
  var hc = s.hair && s.hair.color1 != null ? s.hair.color1 : 0;
  var hairC = HAIR_HEX[hc] || '#3a2a18';
  var ec = s.hair && s.hair.eyeColor != null ? s.hair.eyeColor : 0;
  var eyeC = EYE_HEX[ec] || '#6b8e5a';
  var lipR = Math.min(255, sR + 25);
  var lipG = Math.round(sG * 0.5 + 25);
  var lipB = Math.round(sB * 0.5 + 20);
  var lipC = 'rgb('+lipR+','+lipG+','+lipB+')';
  var isFem = s.gender === 'female';
  // Facial hair opacity (male only)
  var fhOp = (!isFem && s.overlays && s.overlays.facialhairStyle) ? Math.min(0.6, s.overlays.facialhairStyle / 300) : 0;

  return '<svg viewBox="0 0 140 170" width="140" height="170" style="display:block;margin:0 auto 8px">' +
    // Hair behind head
    '<ellipse cx="70" cy="55" rx="52" ry="48" fill="'+hairC+'"/>' +
    '<path d="M18,65 Q25,15 70,8 Q115,15 122,65" fill="'+hairC+'"/>' +
    // Neck
    '<rect x="56" y="130" width="28" height="30" rx="8" fill="'+skinC+'"/>' +
    // Head
    '<ellipse cx="70" cy="75" rx="46" ry="56" fill="'+skinC+'" stroke="'+skinD+'" stroke-width="1"/>' +
    // Ears
    '<ellipse cx="24" cy="78" rx="7" ry="12" fill="'+skinC+'" stroke="'+skinD+'" stroke-width=".5"/>' +
    '<ellipse cx="116" cy="78" rx="7" ry="12" fill="'+skinC+'" stroke="'+skinD+'" stroke-width=".5"/>' +
    // Brows (thinner for female)
    '<path d="M44,64 Q54,58 66,63" fill="none" stroke="'+hairC+'" stroke-width="'+(isFem?'1.5':'2.5')+'" stroke-linecap="round"/>' +
    '<path d="M74,63 Q86,58 96,64" fill="none" stroke="'+hairC+'" stroke-width="'+(isFem?'1.5':'2.5')+'" stroke-linecap="round"/>' +
    // Eyes (sclera)
    '<ellipse cx="54" cy="74" rx="11" ry="'+(isFem?'7':'6')+'" fill="#f2ece4" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>' +
    '<ellipse cx="86" cy="74" rx="11" ry="'+(isFem?'7':'6')+'" fill="#f2ece4" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>' +
    // Iris
    '<circle cx="54" cy="74" r="4.5" fill="'+eyeC+'"/>' +
    '<circle cx="86" cy="74" r="4.5" fill="'+eyeC+'"/>' +
    // Pupils
    '<circle cx="54" cy="74" r="2" fill="#111"/>' +
    '<circle cx="86" cy="74" r="2" fill="#111"/>' +
    // Eye highlights
    '<circle cx="56" cy="72" r="1.2" fill="#fff" opacity=".5"/>' +
    '<circle cx="88" cy="72" r="1.2" fill="#fff" opacity=".5"/>' +
    // Eyelashes (female only)
    (isFem ? '<path d="M43,71 Q54,66 65,70" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>' +
             '<path d="M75,70 Q86,66 97,71" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>' +
             '<line x1="43" y1="71" x2="40" y2="69" stroke="#222" stroke-width="1" stroke-linecap="round"/>' +
             '<line x1="65" y1="70" x2="68" y2="68" stroke="#222" stroke-width="1" stroke-linecap="round"/>' +
             '<line x1="75" y1="70" x2="72" y2="68" stroke="#222" stroke-width="1" stroke-linecap="round"/>' +
             '<line x1="97" y1="71" x2="100" y2="69" stroke="#222" stroke-width="1" stroke-linecap="round"/>' : '') +
    // Nose
    '<line x1="70" y1="72" x2="70" y2="92" stroke="'+skinD+'" stroke-width="1" opacity=".4"/>' +
    '<ellipse cx="70" cy="93" rx="'+(isFem?'5':'6')+'" ry="3.5" fill="'+skinC+'" stroke="'+skinD+'" stroke-width=".5"/>' +
    // Mouth (fuller lips for female)
    '<path d="M58,108 Q64,104 70,106 Q76,104 82,108" fill="none" stroke="'+lipC+'" stroke-width="'+(isFem?'2.5':'2')+'" stroke-linecap="round"/>' +
    '<path d="M60,109 Q70,'+(isFem?'117':'115')+' 80,109" fill="'+(isFem?lipC:'none')+'" opacity="'+(isFem?'.3':'.5')+'" stroke="'+lipC+'" stroke-width="'+(isFem?'2':'1.5')+'"/>' +
    // Facial hair (male only)
    (fhOp > 0 ? '<rect x="56" y="112" width="28" height="14" rx="6" fill="'+hairC+'" opacity="'+fhOp+'"/>' : '') +
    '</svg>';
}

function render() {
  var souls = getSouls();
  var grid = document.getElementById('soulGrid');
  // Show search bar if 3+ souls
  var searchBar = document.getElementById('searchBar');
  if (searchBar) searchBar.style.display = souls.length >= 3 ? '' : 'none';
  var html = '';
  for (var i = 0; i < souls.length; i++) {
    var s = souls[i];
    var f1s = s.heritage && s.heritage.face1Style != null ? s.heritage.face1Style : '—';
    var f1t = s.heritage && s.heritage.face1Texture != null ? s.heritage.face1Texture : '—';
    var fMix = s.heritage && s.heritage.faceMix != null ? s.heritage.faceMix : '—';
    var sMix = s.heritage && s.heritage.skinMix != null ? s.heritage.skinMix : '—';
    var skinT = s.heritage && s.heritage.skinTone != null ? s.heritage.skinTone + '%' : '—';
    var hair = s.hair && s.hair.style != null ? s.hair.style : '—';
    var hc1 = s.hair && s.hair.color1 != null ? s.hair.color1 : '—';
    var eyeIdx = s.hair && s.hair.eyeColor != null ? s.hair.eyeColor : null;
    var eyeStr = eyeIdx != null ? (EYE_COLORS[eyeIdx] || eyeIdx) : '—';
    var soulName = esc(s.name || 'Unnamed Soul');
    var fh = s.overlays && s.overlays.facialhairStyle ? s.overlays.facialhairStyle : 0;

    html += '<div class="soul-card" data-soul-name="' + soulName.toLowerCase() + '">' + cardFaceSvg(s) +
      '<div class="name">' + soulName + '</div>' +
      '<div class="info">' +
        '<div class="stat"><span class="sl">Skin Tone</span><span class="sv">' + esc(String(skinT)) + '</span></div>' +
        '<div class="stat"><span class="sl">Eyes</span><span class="sv">' + esc(String(eyeStr)) + '</span></div>' +
        '<div class="stat"><span class="sl">Hair Color</span><span class="sv">#' + esc(String(hc1)) + '</span></div>' +
        '<div class="stat"><span class="sl">Face 1</span><span class="sv">' + esc(String(f1s)) + ' / ' + esc(String(f1t)) + '</span></div>' +
        '<div class="stat"><span class="sl">Face Mix</span><span class="sv">' + esc(String(fMix)) + '</span></div>' +
        (fh > 0 ? '<div class="stat"><span class="sl">Facial Hair</span><span class="sv">' + fh + '</span></div>' : '') +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-sm" onclick="editSoul(' + i + ')">Edit</button>' +
        '<button class="btn btn-sm btn-cyan" onclick="saveSoulToFile(' + i + ')">Save JSON</button>' +
        (_knownCities.length > 1 ? '<button class="btn btn-sm" style="background:var(--warn);color:#000" onclick="transferSoul(' + i + ')">Transfer</button>' : '') +
        '<button class="btn btn-sm btn-danger" onclick="deleteSoul(' + i + ')">Delete</button>' +
      '</div></div>';
  }
  html += '<div class="add-card" onclick="newSoul()"><span class="plus">+</span>New Soul</div>';
  grid.innerHTML = html;
}

// --- Live Preview ---
function getVal(key) {
  var input = document.querySelector('[data-key="' + key + '"]');
  if (!input || input.value === '') return null;
  return parseFloat(input.value);
}

function fmtVal(v) {
  if (v == null) return '<span class="val empty">—</span>';
  return '<span class="val">' + v + '</span>';
}

/* ===== SVG FACE PREVIEW ===== */
function updateFaceSvg() {
  // Force-reset female elements at the top — prevents stale state from any code path
  var _fem = document.getElementById('fFemale');
  if (_fem) _fem.style.display = currentGender === 'female' ? '' : 'none';
  // Skin tone — non-linear: 50% should look caucasian, not brown
  var skinTone = (getVal('heritage.skinTone') || 50) / 100;
  var t = Math.pow(skinTone, 0.7); // gamma push: 50% → ~62% effective
  var sR = Math.round(80 + t * 175);
  var sG = Math.round(55 + t * 165);
  var sB = Math.round(40 + t * 145);
  var skinHex = 'rgb(' + Math.min(255,sR) + ',' + Math.min(255,sG) + ',' + Math.min(255,sB) + ')';
  var skinDark = 'rgb(' + Math.round(Math.min(255,sR)*0.8) + ',' + Math.round(Math.min(255,sG)*0.8) + ',' + Math.round(Math.min(255,sB)*0.8) + ')';
  var skinMid = 'rgb(' + Math.round(Math.min(255,sR)*0.88) + ',' + Math.round(Math.min(255,sG)*0.88) + ',' + Math.round(Math.min(255,sB)*0.88) + ')';

  // Lip color
  var lipR = Math.min(255, sR + 30);
  var lipG = Math.round(sG * 0.5 + 30);
  var lipB = Math.round(sB * 0.5 + 25);
  var lipHex = 'rgb(' + lipR + ',' + lipG + ',' + lipB + ')';

  // Apply skin color to face elements
  var skinEls = ['fHead','fJaw','fNeck','fEarL','fEarR','fNose'];
  for (var i = 0; i < skinEls.length; i++) {
    var el = document.getElementById(skinEls[i]);
    if (el) el.setAttribute('fill', skinHex);
  }
  var strokeEls = ['fHead','fJaw','fNeck','fEarL','fEarR'];
  for (var i = 0; i < strokeEls.length; i++) {
    var el = document.getElementById(strokeEls[i]);
    if (el) el.setAttribute('stroke', skinDark);
  }
  var noseEl = document.getElementById('fNose');
  if (noseEl) noseEl.setAttribute('stroke', skinMid);
  var bridgeEl = document.getElementById('fNoseBridge');
  if (bridgeEl) bridgeEl.setAttribute('stroke', skinMid);
  var nwL = document.getElementById('fNoseWingL');
  var nwR = document.getElementById('fNoseWingR');
  if (nwL) nwL.setAttribute('fill', skinMid);
  if (nwR) nwR.setAttribute('fill', skinMid);

  // Apply lip color
  var mouth = document.getElementById('fMouth');
  if (mouth) mouth.setAttribute('stroke', lipHex);

  // Hair color — use sampled color only if it looks like natural hair (warm, not blue/purple)
  var hc = getVal('hair.color1');
  var hairHex = (hc != null && HAIR_HEX[hc]) ? HAIR_HEX[hc] : '#3a2a18';
  if (window._sampledHairRgb) {
    var shr = window._sampledHairRgb[0], shg = window._sampledHairRgb[1], shb = window._sampledHairRgb[2];
    // Only use if it's a natural hair color (not blue/purple/cyan)
    if (shb <= shr || shb <= shg) {
      hairHex = rgbToHex(shr, shg, shb);
    }
  }
  var hairBack = document.getElementById('fHairBack');
  var hairTop = document.getElementById('fHairTop');
  if (hairBack) hairBack.setAttribute('fill', hairHex);
  if (hairTop) hairTop.setAttribute('fill', hairHex);

  // Hair style affects volume
  var hs = getVal('hair.style') || 0;
  var hairVol = 5 + (hs % 12) * 2;
  if (hairBack) { hairBack.setAttribute('rx', 95 + hairVol); hairBack.setAttribute('ry', 100 + hairVol); hairBack.setAttribute('cy', 120 - hairVol/2); }
  if (hairTop) hairTop.setAttribute('d', 'M'+(45-hairVol)+',140 Q'+(50-hairVol/2)+','+(40-hairVol)+' 140,'+(25-hairVol)+' Q'+(230+hairVol/2)+','+(40-hairVol)+' '+(235+hairVol)+',140');

  // Eyebrow color matches hair
  var browLEl2 = document.getElementById('fBrowL');
  var browREl2 = document.getElementById('fBrowR');
  if (browLEl2) browLEl2.setAttribute('stroke', hairHex);
  if (browREl2) browREl2.setAttribute('stroke', hairHex);

  // Eye color
  var ec = getVal('hair.eyeColor');
  var irisHex = (ec != null && EYE_HEX[ec]) ? EYE_HEX[ec] : '#6b8e5a';
  if (window._sampledEyeRgb) {
    var ser = window._sampledEyeRgb[0], seg = window._sampledEyeRgb[1], seb = window._sampledEyeRgb[2];
    var seMax = Math.max(ser, seg, seb), seMin = Math.min(ser, seg, seb);
    var seSat = seMax > 0 ? (seMax - seMin) / seMax : 0;
    // Compare to current skin color from the SVG
    var skinNums = skinHex.match(/\d+/g);
    var svgSkin = skinNums ? [parseInt(skinNums[0]), parseInt(skinNums[1]), parseInt(skinNums[2])] : [150, 120, 100];
    var seSkinDist = colorDist(window._sampledEyeRgb, svgSkin);
    if (seSat > 0.15 && seSkinDist > 30) {
      irisHex = rgbToHex(ser, seg, seb);
    }
  }
  var irisL = document.getElementById('fIrisL');
  var irisR = document.getElementById('fIrisR');
  if (irisL) irisL.setAttribute('fill', irisHex);
  if (irisR) irisR.setAttribute('fill', irisHex);

  // Jaw width
  var jw = getVal('face.jawWidth') || 0;
  var jawEl = document.getElementById('fJaw');
  if (jawEl) {
    var baseW = 80;
    var w = baseW + jw * 20;
    jawEl.setAttribute('d', 'M' + (140 - w) + ',170 Q' + (140 - w + 5) + ',270 140,280 Q' + (140 + w - 5) + ',270 ' + (140 + w) + ',170');
  }

  // Jaw height
  var jh = getVal('face.jawHeight') || 0;
  var headEl = document.getElementById('fHead');
  if (headEl) headEl.setAttribute('ry', 115 + jh * 12);

  // Nose width
  var nw = getVal('face.noseWidth') || 0;
  if (noseEl) noseEl.setAttribute('rx', 14 + nw * 6);
  if (nwL) nwL.setAttribute('rx', 7 + nw * 3);
  if (nwR) nwR.setAttribute('rx', 7 + nw * 3);

  // Nose height / length
  var nh = getVal('face.noseHeight') || 0;
  var nl = getVal('face.noseLength') || 0;
  var noseY = 185 + nl * 10 - nh * 8;
  if (noseEl) noseEl.setAttribute('cy', noseY);
  if (bridgeEl) bridgeEl.setAttribute('y2', noseY - 5);

  // Nose bridge
  var nb = getVal('face.noseBridge') || 0;
  if (bridgeEl) bridgeEl.setAttribute('stroke-width', 2 + nb * 1.5);

  // Nose shift
  var ns = getVal('face.noseShift') || 0;
  if (noseEl) noseEl.setAttribute('cx', 140 + ns * 8);
  if (bridgeEl) { bridgeEl.setAttribute('x1', 140 + ns * 8); bridgeEl.setAttribute('x2', 140 + ns * 8); }

  // Cheek width
  var cw = getVal('face.cheekWidth') || 0;
  var cheekL = document.getElementById('fCheekL');
  var cheekR = document.getElementById('fCheekR');
  if (cheekL) cheekL.setAttribute('rx', 22 + cw * 8);
  if (cheekR) cheekR.setAttribute('rx', 22 + cw * 8);

  // Cheek bone / height
  var cb = getVal('face.cheekBone') || 0;
  var ch = getVal('face.cheekHeight') || 0;
  if (cheekL) { cheekL.setAttribute('cx', 80 - cb * 6); cheekL.setAttribute('cy', 190 - ch * 8); }
  if (cheekR) { cheekR.setAttribute('cx', 200 + cb * 6); cheekR.setAttribute('cy', 190 - ch * 8); }

  // Chin
  var chin = getVal('face.chin') || 0;
  var chinEl = document.getElementById('fChin');
  if (chinEl) { chinEl.setAttribute('cy', 255 + chin * 10); chinEl.setAttribute('ry', 8 + Math.abs(chin) * 4); }

  // Brow
  var brow = getVal('face.brow') || 0;
  var browLEl = document.getElementById('fBrowL');
  var browREl = document.getElementById('fBrowR');
  var browY = 118 - brow * 8;
  var browMidY = 108 - brow * 10;
  if (browLEl) browLEl.setAttribute('d', 'M85,' + browY + ' Q105,' + browMidY + ' 130,' + (browY - 2));
  if (browREl) browREl.setAttribute('d', 'M150,' + (browY - 2) + ' Q175,' + browMidY + ' 195,' + browY);

  // Eyes openness
  var eyes = getVal('face.eyes') || 0;
  var eyeRy = 12 + eyes * 5;
  var eyeLEl = document.getElementById('fEyeL');
  var eyeREl = document.getElementById('fEyeR');
  if (eyeLEl) eyeLEl.setAttribute('ry', eyeRy);
  if (eyeREl) eyeREl.setAttribute('ry', eyeRy);

  // Overlays
  var fhStyle = getVal('overlays.facialhairStyle') || 0;
  var agingStyle = getVal('overlays.agingStyle') || 0;
  var makeupStyle = getVal('overlays.makeupStyle') || 0;
  var blemishStyle = getVal('overlays.blemishesStyle') || 0;
  var complexionStyle = getVal('overlays.complexionStyle') || 0;

  var fhEl = document.getElementById('fFacialHair');
  var agEl = document.getElementById('fAging');
  var mkEl = document.getElementById('fMakeup');
  var blEl = document.getElementById('fBlemishes');
  var cpEl = document.getElementById('fComplexion');

  if (fhEl) fhEl.setAttribute('opacity', (currentGender !== 'female' && fhStyle > 0) ? Math.min(0.9, fhStyle / 200) : 0);
  if (agEl) agEl.setAttribute('opacity', agingStyle > 0 ? Math.min(0.8, agingStyle / 200) : 0);
  if (mkEl) mkEl.setAttribute('opacity', makeupStyle > 0 ? Math.min(0.9, makeupStyle / 200) : 0);
  if (blEl) blEl.setAttribute('opacity', blemishStyle > 0 ? Math.min(0.8, blemishStyle / 200) : 0);
  if (cpEl) cpEl.setAttribute('opacity', complexionStyle > 0 ? Math.min(0.7, complexionStyle / 200) : 0);

  // Gender-specific features
  var isFemale = currentGender === 'female';
  var femaleEl = document.getElementById('fFemale');
  if (femaleEl) femaleEl.style.display = isFemale ? '' : 'none';
  // Brow thickness: thicker/bolder for male, thin for female
  var browLEl2 = document.getElementById('fBrowL');
  var browREl2 = document.getElementById('fBrowR');
  if (browLEl2) browLEl2.setAttribute('stroke-width', isFemale ? '1.8' : '3.5');
  if (browREl2) browREl2.setAttribute('stroke-width', isFemale ? '1.8' : '3.5');
  // Lip color
  if (mouth) {
    if (isFemale) {
      var fLipR = Math.min(255, sR + 50);
      var fLipG = Math.round(sG * 0.4 + 20);
      var fLipB = Math.round(sB * 0.4 + 15);
      mouth.setAttribute('stroke', 'rgb('+fLipR+','+fLipG+','+fLipB+')');
      mouth.setAttribute('stroke-width', '3.5');
    } else {
      // Male lips: barely visible, very close to skin tone
      mouth.setAttribute('stroke', skinDark);
      mouth.setAttribute('stroke-width', '2');
    }
  }
  // Male stubble shadow on chin/jaw
  var stubbleEl = document.getElementById('fStubble');
  if (!stubbleEl) {
    var sv = document.getElementById('faceSvg');
    if (sv) {
      stubbleEl = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
      stubbleEl.id = 'fStubble';
      stubbleEl.setAttribute('cx', '140');
      stubbleEl.setAttribute('cy', '248');
      stubbleEl.setAttribute('rx', '45');
      stubbleEl.setAttribute('ry', '25');
      // Insert before fFemale group so it's behind eyelashes
      var femG = document.getElementById('fFemale');
      if (femG) sv.insertBefore(stubbleEl, femG);
      else sv.appendChild(stubbleEl);
    }
  }
  if (stubbleEl) {
    if (isFemale) {
      stubbleEl.setAttribute('opacity', '0');
    } else {
      stubbleEl.setAttribute('fill', skinDark);
      stubbleEl.setAttribute('opacity', '0.12');
    }
  }
  // Neck: thicker for male, thinner for female
  var neckEl = document.getElementById('fNeck');
  if (neckEl) {
    if (isFemale) {
      neckEl.setAttribute('x', '118'); neckEl.setAttribute('width', '44'); neckEl.setAttribute('rx', '12');
    } else {
      neckEl.setAttribute('x', '106'); neckEl.setAttribute('width', '68'); neckEl.setAttribute('rx', '16');
    }
  }
  // Lip fill for female
  var lipFill = document.getElementById('fLipFill');
  var lipFull = document.getElementById('fLipFull');
  if (lipFill) {
    if (isFemale) {
      var fLipR2 = Math.min(255, sR + 60);
      var fLipG2 = Math.round(sG * 0.35 + 15);
      var fLipB2 = Math.round(sB * 0.35 + 10);
      lipFill.setAttribute('fill', 'rgb('+fLipR2+','+fLipG2+','+fLipB2+')');
      lipFull.setAttribute('stroke', 'rgb('+fLipR2+','+fLipG2+','+fLipB2+')');
    } else {
      lipFill.setAttribute('fill', '#c07068');
      lipFull.setAttribute('stroke', '#c07068');
    }
  }
  // Jaw: softer/narrower for female, wider for male
  var jawEl = document.getElementById('fJaw');
  if (jawEl) {
    var jw = getVal('face.jawWidth') || 0;
    if (isFemale) {
      var baseW = 75 + jw * 20;
      jawEl.setAttribute('d', 'M' + (140 - baseW) + ',170 Q' + (140 - baseW + 8) + ',268 140,278 Q' + (140 + baseW - 8) + ',268 ' + (140 + baseW) + ',170');
    } else {
      // Male: wide, angular jaw with squared corners
      var baseW = 88 + jw * 25;
      jawEl.setAttribute('d', 'M' + (140 - baseW) + ',170 L' + (140 - baseW + 8) + ',255 L' + (140 - baseW + 25) + ',272 Q140,284 ' + (140 + baseW - 25) + ',272 L' + (140 + baseW - 8) + ',255 L' + (140 + baseW) + ',170');
    }
  }
}

// --- Import/Export ---
var importMode = 'soul'; // 'soul' or 'city'

// --- Soul JSON (single soul) ---
function openLoadSoul() {
  importMode = 'soul';
