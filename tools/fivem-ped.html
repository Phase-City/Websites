function doImportSoul() {
  var raw = document.getElementById('importData').value.trim();
  if (!raw) return;
  try {
    var soul = JSON.parse(raw);
    if (typeof soul !== 'object' || !soul) throw new Error('Invalid');
    if (!soul.name) soul.name = 'Imported Soul';
    if (!soul.gender) soul.gender = 'male';
    var souls = getSouls(); souls.push(soul); setSouls(souls);
    closeImport(); render(); toast('Soul loaded!');
  } catch(e) { alert('Invalid JSON. Make sure you pasted a valid soul export.'); }
}

// --- City JSON (all souls for a city) ---
async function saveCityJson() {
  var souls = getSouls();
  if (souls.length === 0) { toast('No souls to save', 'warn'); return; }
  if (!_currentCityName) {
    var name = prompt('City name:', 'Phase City');
    if (!name || !name.trim()) return;
    _currentCityName = name.trim();
    updateCityLabel();
  }
  var cityData = { city: _currentCityName, exportedAt: new Date().toISOString(), souls: souls };
  var json = JSON.stringify(cityData, null, 2);
  var suggestedFile = _currentCityName.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '-souls.json';

  // Try File System Access API (modern browsers)
  if (window.showSaveFilePicker) {
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: suggestedFile,
        types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }]
      });
      var writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      toast('City saved! (' + souls.length + ' souls)');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // user cancelled
      // Fall through to download fallback
    }
  }

  // Fallback: trigger download
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = suggestedFile;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('City downloaded! (' + souls.length + ' souls)');
}
async function openLoadCity() {
  // Try File System Access API first (open file picker)
  if (window.showOpenFilePicker) {
    try {
      var handles = await window.showOpenFilePicker({
        types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }],
        multiple: false
      });
      var fileHandle = handles[0];
      var file = await fileHandle.getFile();
      var raw = await file.text();
      var data = JSON.parse(raw);
      var cityName = data.city || file.name.replace('.json', '');
      // Track this city for transfer
      _currentCityName = cityName;
      var existing = _knownCities.find(function(c) { return c.name === cityName; });
      if (existing) { existing.fileHandle = fileHandle; }
      else { _knownCities.push({ name: cityName, fileHandle: fileHandle }); }
      loadCityFromJson(raw);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // user cancelled
      // Fall through to paste modal
    }
  }

  // Fallback: show paste modal
  importMode = 'city';
  document.getElementById('importTitle').textContent = 'Load City JSON';
  document.getElementById('importDesc').textContent = 'Paste a city JSON to load all souls. This will REPLACE your current souls for this city.';
  document.getElementById('importData').value = '';
  document.getElementById('importData').placeholder = '{"city":"Phase City","souls":[...]}';
  document.getElementById('importBtn').textContent = 'Load City';
  document.getElementById('importBtn').setAttribute('onclick', 'doImportCity()');
  document.getElementById('importModal').classList.add('open');
}
function doImportCity() {
  var raw = document.getElementById('importData').value.trim();
  if (!raw) return;
  loadCityFromJson(raw);
}
function loadCityFromJson(raw) {
  try {
    var data = JSON.parse(raw);
    var souls;
    if (Array.isArray(data)) {
      souls = data;
    } else if (data.souls && Array.isArray(data.souls)) {
      souls = data.souls;
    } else {
      throw new Error('Expected {souls:[...]} or an array of souls');
    }
    if (souls.length === 0) { alert('No souls found in the JSON.'); return; }
    // Ensure all souls have a gender field (older exports may lack it)
    for (var i = 0; i < souls.length; i++) { if (!souls[i].gender) souls[i].gender = 'male'; }
    if (!confirm('This will replace your current ' + getSouls().length + ' soul(s) with ' + souls.length + ' soul(s). Continue?')) return;
    // Set city name from JSON data
    if (!_currentCityName && data.city) _currentCityName = data.city;
    updateCityLabel();
    setSouls(souls);
    closeImport(); render(); toast(_currentCityName + ' loaded — ' + souls.length + ' souls');
  } catch(e) { alert('Invalid city JSON: ' + e.message); }
}

// --- Extract System (Color Sampler + OCR + Paste) ---
var samplerMode = 'skin';
var extractTab = 'face';
var imgCtx = null;
var imgLoaded = false;

function setExtractTab(tab) {
  extractTab = tab;
  // Toggle tab buttons via data-tab attribute
  var tabs = document.querySelectorAll('.extract-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
  }
  // Toggle panels via ID map
  var panelMap = { face: 'panelFace', color: 'panelColor', ocr: 'panelOcr', paste: 'panelPaste' };
  var panels = document.querySelectorAll('.extract-panel');
  for (var i = 0; i < panels.length; i++) {
    panels[i].classList.toggle('active', panels[i].id === panelMap[tab]);
  }
  // Update canvas cursor
  var canvas = document.getElementById('imgCanvas');
  if (canvas) canvas.style.cursor = (tab === 'face' || tab === 'color') ? 'crosshair' : 'default';
  // Clear overlay when switching away from face select
  var overlay = document.getElementById('imgOverlay');
  if (overlay && tab !== 'face') {
    var ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
  }
  // Reset canvas zoom when switching tabs (so manual draw works on full image)
  if (canvas && tab !== 'face') {
    canvas.style.transform = '';
    canvas.style.transformOrigin = '';
  }
}

function setupExtract() {
  // File browse
  document.addEventListener('click', function(e) {
    var drop = document.getElementById('imgDrop');
    if (drop && e.target.closest && e.target.closest('.img-drop') && e.target.tagName !== 'INPUT') {
      var f = document.getElementById('imgFile');
      if (f) f.click();
    }
  });
  document.addEventListener('change', function(e) {
    if (e.target.id === 'imgFile' && e.target.files.length) { loadExtractImage(e.target.files[0]); e.target.value = ''; }
  });
  document.addEventListener('dragover', function(e) {
    var drop = document.getElementById('imgDrop');
    if (drop && drop.contains(e.target)) { e.preventDefault(); drop.classList.add('dragover'); }
  });
  document.addEventListener('dragleave', function(e) {
    var drop = document.getElementById('imgDrop');
    if (drop && !drop.contains(e.relatedTarget)) drop.classList.remove('dragover');
  });
  document.addEventListener('drop', function(e) {
    var drop = document.getElementById('imgDrop');
    if (drop && drop.contains(e.target)) {
      e.preventDefault(); drop.classList.remove('dragover');
      if (e.dataTransfer.files.length) loadExtractImage(e.dataTransfer.files[0]);
    }
  });
  document.addEventListener('paste', function(e) {
    if (!document.getElementById('editModal').classList.contains('open')) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) { loadExtractImage(items[i].getAsFile()); break; }
    }
  });
  // Canvas click for color sampling
  document.addEventListener('click', function(e) {
    if (e.target.id === 'imgCanvas' && imgCtx && extractTab === 'color') {
      var rect = e.target.getBoundingClientRect();
      var scaleX = e.target.width / rect.width;
      var scaleY = e.target.height / rect.height;
      var x = Math.round((e.clientX - rect.left) * scaleX);
      var y = Math.round((e.clientY - rect.top) * scaleY);
      var rgb = sampleArea(x, y, 5);
      applySampledColor(rgb);
    }
  });

  // Face select box drawing
  var faceBoxStart = null;
  var faceBoxDrawing = false;
  document.addEventListener('mousedown', function(e) {
    if (e.target.id === 'imgCanvas' && extractTab === 'face' && imgCtx) {
      var rect = e.target.getBoundingClientRect();
      faceBoxStart = { x: e.clientX - rect.left, y: e.clientY - rect.top, rect: rect };
      faceBoxDrawing = true;
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', function(e) {
    if (!faceBoxDrawing || !faceBoxStart) return;
    var rect = faceBoxStart.rect;
    var curX = e.clientX - rect.left;
    var curY = e.clientY - rect.top;
    drawFaceBox(faceBoxStart.x, faceBoxStart.y, curX, curY, rect.width, rect.height);
  });
  document.addEventListener('mouseup', function(e) {
    if (!faceBoxDrawing || !faceBoxStart) return;
    faceBoxDrawing = false;
    var rect = faceBoxStart.rect;
    var curX = e.clientX - rect.left;
    var curY = e.clientY - rect.top;
    var canvas = document.getElementById('imgCanvas');
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var x1 = Math.round(Math.min(faceBoxStart.x, curX) * scaleX);
    var y1 = Math.round(Math.min(faceBoxStart.y, curY) * scaleY);
    var x2 = Math.round(Math.max(faceBoxStart.x, curX) * scaleX);
    var y2 = Math.round(Math.max(faceBoxStart.y, curY) * scaleY);
    faceBoxStart = null;
    if (x2 - x1 > 10 && y2 - y1 > 10) {
      extractFromFaceBox(x1, y1, x2, y2);
    }
  });

  // Draggable eye markers
  var dragMarker = null, dragOffset = {x: 0, y: 0};
  document.addEventListener('mousedown', function(e) {
    var marker = e.target.closest('.face-marker');
    if (!marker) return;
    dragMarker = marker;
    var rect = marker.getBoundingClientRect();
    dragOffset.x = e.clientX - rect.left - rect.width / 2;
    dragOffset.y = e.clientY - rect.top - rect.height / 2;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragMarker) return;
    var wrap = document.getElementById('imgWrap');
    if (!wrap) return;
    var wr = wrap.getBoundingClientRect();
    var pctX = ((e.clientX - dragOffset.x - wr.left) / wr.width * 100);
    var pctY = ((e.clientY - dragOffset.y - wr.top) / wr.height * 100);
    pctX = Math.max(0, Math.min(100, pctX));
    pctY = Math.max(0, Math.min(100, pctY));
    dragMarker.style.left = pctX + '%';
    dragMarker.style.top = pctY + '%';
    updateMarkerSkeleton();
  });
  document.addEventListener('mouseup', function() { dragMarker = null; });

  // Touch support for markers
  document.addEventListener('touchstart', function(e) {
    var marker = e.target.closest('.face-marker');
    if (!marker) return;
    dragMarker = marker;
    var touch = e.touches[0];
    var rect = marker.getBoundingClientRect();
    dragOffset.x = touch.clientX - rect.left - rect.width / 2;
    dragOffset.y = touch.clientY - rect.top - rect.height / 2;
    e.preventDefault();
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    if (!dragMarker) return;
    var touch = e.touches[0];
    var wrap = document.getElementById('imgWrap');
    if (!wrap) return;
    var wr = wrap.getBoundingClientRect();
    var pctX = ((touch.clientX - dragOffset.x - wr.left) / wr.width * 100);
    var pctY = ((touch.clientY - dragOffset.y - wr.top) / wr.height * 100);
    pctX = Math.max(0, Math.min(100, pctX));
    pctY = Math.max(0, Math.min(100, pctY));
    dragMarker.style.left = pctX + '%';
    dragMarker.style.top = pctY + '%';
    updateMarkerSkeleton();
    e.preventDefault();
  }, {passive: false});
  document.addEventListener('touchend', function() { dragMarker = null; });
}

function showEyeMarkers(eyePair, skinBlob) {
  var ids = ['eyeMarkerL','eyeMarkerR','hairMarker','skinMarkerL','skinMarkerR'];
  var defaults = {eyeMarkerL:{l:'35%',t:'40%'},eyeMarkerR:{l:'55%',t:'40%'},hairMarker:{l:'45%',t:'25%'},skinMarkerL:{l:'33%',t:'50%'},skinMarkerR:{l:'57%',t:'50%'}};
  var canvas = document.getElementById('imgCanvas');
  var cw = canvas ? canvas.width : 1;
  var ch = canvas ? canvas.height : 1;

  // Use skin blob geometry for marker placement when available
  // Even without an eye pair, the blob tells us where the face/body is
  if (skinBlob && !eyePair) {
    var blobCx = (skinBlob.x1 + skinBlob.x2) / 2;
    var blobW = skinBlob.x2 - skinBlob.x1;
    var blobH = skinBlob.y2 - skinBlob.y1;
    // Estimate face proportions from blob (face is roughly top 40% of a full-body blob)
    var faceTop = skinBlob.y1;
    var faceH = Math.min(blobH, blobW * 1.4); // face height ~1.4x face width
    var faceW = faceH / 1.4;
    // Eyes at ~42% down from face top, spaced ~35% of face width apart
    var eyeY = faceTop + faceH * 0.42;
    var eyeGap = faceW * 0.35;
    defaults = {
      eyeMarkerL: {l: ((blobCx - eyeGap / 2) / cw * 100).toFixed(1) + '%', t: (eyeY / ch * 100).toFixed(1) + '%'},
      eyeMarkerR: {l: ((blobCx + eyeGap / 2) / cw * 100).toFixed(1) + '%', t: (eyeY / ch * 100).toFixed(1) + '%'},
      hairMarker: {l: (blobCx / cw * 100).toFixed(1) + '%', t: (Math.max(0, faceTop + faceH * 0.08) / ch * 100).toFixed(1) + '%'},
      skinMarkerL: {l: ((blobCx - faceW * 0.25) / cw * 100).toFixed(1) + '%', t: ((faceTop + faceH * 0.52) / ch * 100).toFixed(1) + '%'},
      skinMarkerR: {l: ((blobCx + faceW * 0.25) / cw * 100).toFixed(1) + '%', t: ((faceTop + faceH * 0.52) / ch * 100).toFixed(1) + '%'}
    };
    console.log('Markers initialized from skin blob: center=(' + (blobCx/cw*100).toFixed(0) + '%,' + (faceTop/ch*100).toFixed(0) + '%) faceW=' + Math.round(faceW) + ' faceH=' + Math.round(faceH));
  }

  // If auto-detect found an eye pair, use it (more precise than blob alone)
  if (eyePair) {
    var lxPct = (eyePair.lx / cw * 100).toFixed(1) + '%';
    var rxPct = (eyePair.rx / cw * 100).toFixed(1) + '%';
    var eyYPct = (eyePair.y / ch * 100).toFixed(1) + '%';
    var midXPct = ((eyePair.lx + eyePair.rx) / 2 / cw * 100).toFixed(1) + '%';
    // Use blob top for hair marker if available (actual hairline), otherwise estimate from eye gap
    var hairY = skinBlob ? Math.max(0, skinBlob.y1 + (skinBlob.y2 - skinBlob.y1) * 0.05) : Math.max(0, eyePair.y - eyePair.gap * 1.2);
    var hairYPct = (hairY / ch * 100).toFixed(1) + '%';
    // Cheeks: use blob geometry if available for better cheek positioning
    var cheekY = skinBlob ? skinBlob.y1 + (skinBlob.y2 - skinBlob.y1) * 0.35 : eyePair.y + eyePair.gap * 0.6;
    var cheekYPct = (cheekY / ch * 100).toFixed(1) + '%';
    var skinLXPct = ((eyePair.lx - eyePair.gap * 0.3) / cw * 100).toFixed(1) + '%';
    var skinRXPct = ((eyePair.rx + eyePair.gap * 0.3) / cw * 100).toFixed(1) + '%';
    defaults = {
      eyeMarkerL: {l: lxPct, t: eyYPct},
      eyeMarkerR: {l: rxPct, t: eyYPct},
      hairMarker: {l: midXPct, t: hairYPct},
      skinMarkerL: {l: skinLXPct, t: cheekYPct},
      skinMarkerR: {l: skinRXPct, t: cheekYPct}
    };
    console.log('Markers initialized from eye pair' + (skinBlob ? ' + blob geometry' : '') + ': L(' + lxPct + ',' + eyYPct + ') R(' + rxPct + ',' + eyYPct + ') hair=(' + midXPct + ',' + hairYPct + ')');
  }
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) { el.classList.add('visible'); el.style.left = defaults[ids[i]].l; el.style.top = defaults[ids[i]].t; }
  }
  var btn = document.getElementById('extractMarkersBtn');
  if (btn) btn.style.display = '';
  updateMarkerSkeleton();
}

function hideEyeMarkers() {
  var ids = ['eyeMarkerL','eyeMarkerR','hairMarker','skinMarkerL','skinMarkerR'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.classList.remove('visible');
  }
  var btn = document.getElementById('extractMarkersBtn');
  if (btn) btn.style.display = 'none';
}

function updateMarkerSkeleton() {
  var overlay = document.getElementById('imgOverlay');
  var wrap = document.getElementById('imgWrap');
  var ml = document.getElementById('eyeMarkerL');
  var mr = document.getElementById('eyeMarkerR');
  if (!overlay || !wrap || !ml || !mr || !ml.classList.contains('visible')) return;

  var wr = wrap.getBoundingClientRect();
  overlay.width = Math.round(wr.width);
  overlay.height = Math.round(wr.height);
  var ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  var lx = parseFloat(ml.style.left) / 100 * wr.width;
  var ly = parseFloat(ml.style.top) / 100 * wr.height;
  var rx = parseFloat(mr.style.left) / 100 * wr.width;
  var ry = parseFloat(mr.style.top) / 100 * wr.height;

  var gap = rx - lx;
  if (gap < 5) return;

  var cx = (lx + rx) / 2;
  var cy = (ly + ry) / 2;
  var faceW = gap * 2.5;
  var faceH = faceW * 1.4;
  var faceTop = cy - faceH * 0.42;

  ctx.globalAlpha = 0.35;

  // Face box outline
  ctx.strokeStyle = '#7B68EE';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(cx - faceW / 2, faceTop, faceW, faceH);
  ctx.setLineDash([]);

  // Connecting lines from markers to face structure
  var hm = document.getElementById('hairMarker');
  var sl = document.getElementById('skinMarkerL');
  var sr = document.getElementById('skinMarkerR');

  // Hair marker position
  if (hm) {
    var hx = parseFloat(hm.style.left) / 100 * wr.width;
    var hy = parseFloat(hm.style.top) / 100 * wr.height;
    ctx.strokeStyle = '#ffa502';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    // Hair sampling radius
    ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Eye line connecting eyes
  ctx.strokeStyle = '#5CE1E6';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.setLineDash([]);

  // Nose hint
  var noseY = cy + faceH * 0.16;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.moveTo(cx, cy + gap * 0.15); ctx.lineTo(cx, noseY); ctx.stroke();

  // Mouth hint
  var mouthY = cy + faceH * 0.30;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(cx - gap * 0.4, mouthY); ctx.lineTo(cx + gap * 0.4, mouthY); ctx.stroke();
  ctx.setLineDash([]);

  // Skin marker sampling radius
  if (sl && sr) {
    var slx = parseFloat(sl.style.left) / 100 * wr.width;
    var sly = parseFloat(sl.style.top) / 100 * wr.height;
    var srx = parseFloat(sr.style.left) / 100 * wr.width;
    var sry = parseFloat(sr.style.top) / 100 * wr.height;
    ctx.strokeStyle = '#f0a050';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(slx, sly, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(srx, sry, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.globalAlpha = 1.0;
}

function extractFromMarkers() {
  if (!imgCtx) { toast('Upload an image first', 'warn'); return; }
  // Manual marker extraction = user positioned markers deliberately, allow gender detection
  if (!window._autoExtractPass) window._blobUnreliableContext = false;
  var wrap = document.getElementById('imgWrap');
  var canvas = document.getElementById('imgCanvas');
  var ml = document.getElementById('eyeMarkerL');
  var mr = document.getElementById('eyeMarkerR');
  var hm = document.getElementById('hairMarker');
  var sl = document.getElementById('skinMarkerL');
  var sr = document.getElementById('skinMarkerR');
  if (!wrap || !canvas || !ml || !mr) return;

  var wr = wrap.getBoundingClientRect();
  var scaleX = canvas.width / wr.width;
  var scaleY = canvas.height / wr.height;

  // Get positions in canvas pixel coordinates
  var eyeLx = parseFloat(ml.style.left) / 100 * wr.width * scaleX;
  var eyeLy = parseFloat(ml.style.top) / 100 * wr.height * scaleY;
  var eyeRx = parseFloat(mr.style.left) / 100 * wr.width * scaleX;
  var eyeRy = parseFloat(mr.style.top) / 100 * wr.height * scaleY;

  var gap = eyeRx - eyeLx;
  if (gap < 10) { toast('Place the eye markers further apart', 'warn'); return; }

  var cx = (eyeLx + eyeRx) / 2;
  var cy = (eyeLy + eyeRy) / 2;
  var faceW = gap * 2.5;
  var faceH = faceW * 1.4;
  var faceTop = cy - faceH * 0.42;

  var x1 = Math.max(0, Math.round(cx - faceW / 2));
  var y1 = Math.max(0, Math.round(faceTop));
  var x2 = Math.min(canvas.width, Math.round(cx + faceW / 2));
  var y2 = Math.min(canvas.height, Math.round(faceTop + faceH));

  // Build a synthetic skin blob from marker positions
  window._skinBlob = { x1: x1, y1: y1, x2: x2, y2: y2 };
  // Keep _blobTooLarge=true during auto-extract pass (gender unreliable on blob-too-large images)
  if (!window._autoExtractPass) window._blobTooLarge = false;

  // Skin from skin markers (average both — skin averaging works well)
  var markerColors = {};
  if (sl && sr) {
    var slx = Math.round(parseFloat(sl.style.left) / 100 * wr.width * scaleX);
    var sly = Math.round(parseFloat(sl.style.top) / 100 * wr.height * scaleY);
    var srx = Math.round(parseFloat(sr.style.left) / 100 * wr.width * scaleX);
    var sry = Math.round(parseFloat(sr.style.top) / 100 * wr.height * scaleY);
    var skinL = sampleArea(slx, sly, 10);
    var skinR = sampleArea(srx, sry, 10);
    markerColors.skin = [
      Math.round((skinL[0] + skinR[0]) / 2),
      Math.round((skinL[1] + skinR[1]) / 2),
      Math.round((skinL[2] + skinR[2]) / 2)
    ];
  }

  // Hair: scan 20px radius around marker, pick most colorful warm pixel (like auto-detect)
  if (hm) {
    var hmx = Math.round(parseFloat(hm.style.left) / 100 * wr.width * scaleX);
    var hmy = Math.round(parseFloat(hm.style.top) / 100 * wr.height * scaleY);
    // Get skin reference for comparison
    var skinRef = markerColors.skin || sampleArea(Math.round((eyeLx + eyeRx) / 2), Math.round((eyeLy + eyeRy) / 2 + gap * 0.3), 8);
    var bestHairScore = -Infinity, bestHairRgb = sampleArea(hmx, hmy, 5);
    var hairR = 20;
    for (var hy2 = hmy - hairR; hy2 <= hmy + hairR; hy2 += 2) {
      for (var hx2 = hmx - hairR; hx2 <= hmx + hairR; hx2 += 2) {
        if (hx2 < 0 || hy2 < 0 || hx2 >= canvas.width || hy2 >= canvas.height) continue;
        var hp = imgCtx.getImageData(hx2, hy2, 1, 1).data;
        var hr = hp[0], hg = hp[1], hb = hp[2];
        var hBr = (hr + hg + hb) / 3;
        var hMax = Math.max(hr, hg, hb), hMin = Math.min(hr, hg, hb);
        var hSat = hMax > 0 ? (hMax - hMin) / hMax : 0;
        var hDist = colorDist([hr, hg, hb], skinRef);
        if (hBr < 20 || (hBr > 240 && hSat < 0.08)) continue; // skip black/white
        if (hBr > 200 && hSat < 0.30) continue; // skip specular highlights (bright + desaturated)
        if (hb > hr * 1.3 && hb > hg * 1.3) continue; // skip strongly blue (UI)
        // Score: cap brightness so specular highlights don't overwhelm colored hair
        // Saturation matters more for colored hair (red, pink); brightness matters for blonde
        var hs = Math.min(hBr, 180) * 0.6 + hDist * 0.5 + hSat * 120 + (hr > hb ? 15 : 0);
        if (hs > bestHairScore) { bestHairScore = hs; bestHairRgb = [hr, hg, hb]; }
      }
    }
    markerColors.hair = bestHairRgb;
  }

  // Eyes: scan 15px radius around each marker, pick most saturated non-skin pixel (iris)
  var eyeSkinRef = markerColors.skin || [180, 150, 130];
  var bestEyeScore2 = -Infinity, bestEyeRgb2 = null;
  var eyeMarkers = [[Math.round(eyeLx), Math.round(eyeLy)], [Math.round(eyeRx), Math.round(eyeRy)]];
  for (var em = 0; em < eyeMarkers.length; em++) {
    var emx = eyeMarkers[em][0], emy = eyeMarkers[em][1];
    var eR = 25; // larger scan radius to catch iris even if marker is slightly off
    for (var ey2 = emy - eR; ey2 <= emy + eR; ey2 += 1) {
      for (var ex2 = emx - eR; ex2 <= emx + eR; ex2 += 1) {
        if (ex2 < 0 || ey2 < 0 || ex2 >= canvas.width || ey2 >= canvas.height) continue;
        var ep = imgCtx.getImageData(ex2, ey2, 1, 1).data;
        var er2 = ep[0], eg2 = ep[1], eb2 = ep[2];
        var eBr = (er2 + eg2 + eb2) / 3;
        var eMax = Math.max(er2, eg2, eb2), eMin = Math.min(er2, eg2, eb2);
        var eSat = eMax > 0 ? (eMax - eMin) / eMax : 0;
        var eDist = colorDist([er2, eg2, eb2], eyeSkinRef);
        if (eBr < 25 || eBr > 200) continue; // skip extremes
        // Reject gray/desaturated pixels (sclera, skin) — require minimum saturation
        if (eSat < 0.12 && eDist < 40) continue; // gray + skin-like = not iris
        var es2 = eSat * 400 + eDist * 1.0;
        if (eb2 > er2) es2 += 200; // strong blue bonus
        if (eb2 > er2 * 1.3) es2 += 100; // very blue extra
        if (eg2 > er2 && eg2 > eb2) es2 += 100; // green bonus
        if (er2 > eb2 * 1.5 && er2 > eg2) es2 -= 100; // warm penalty (skin/lash)
        if (eDist < 15) es2 -= 150; // too similar to skin
        // Closeness to marker center bonus (prefer pixels near where user pointed)
        var distFromCenter = Math.sqrt(Math.pow(ex2 - emx, 2) + Math.pow(ey2 - emy, 2));
        es2 -= distFromCenter * 2; // slight penalty for distance
        if (es2 > bestEyeScore2) { bestEyeScore2 = es2; bestEyeRgb2 = [er2, eg2, eb2]; }
      }
    }
  }
  if (bestEyeRgb2) markerColors.eye = bestEyeRgb2;

  // Store marker colors so extractFromFaceBox can use them
  window._markerColors = markerColors;

  extractFromFaceBox(x1, y1, x2, y2);
  // Don't hide markers on auto-extract (so user can adjust them)
  if (!window._autoExtractPass) {
    hideEyeMarkers();
  }
  window._autoExtractPass = false;
  toast('Extracted from markers!');
}

function drawFaceBox(x1, y1, x2, y2, cw, ch) {
  var overlay = document.getElementById('imgOverlay');
  if (!overlay) return;
  overlay.width = Math.round(cw);
  overlay.height = Math.round(ch);
  overlay.style.pointerEvents = 'none';
  var ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  // Dim outside the box
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, overlay.width, overlay.height);
  // Clear inside box
  var bx = Math.min(x1, x2), by = Math.min(y1, y2);
  var bw = Math.abs(x2 - x1), bh = Math.abs(y2 - y1);
  ctx.clearRect(bx, by, bw, bh);
  // Draw box border
  ctx.strokeStyle = '#7B68EE';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  // Draw face skeleton guide
  if (bw > 30 && bh > 40) {
    ctx.globalAlpha = 0.5;
    var cx = bx + bw * 0.5;

    // Hair region line
    var hairY = by + bh * 0.1;
    ctx.strokeStyle = '#ffa502';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(bx + 4, hairY); ctx.lineTo(bx + bw - 4, hairY); ctx.stroke();
    ctx.font = '9px sans-serif';
    ctx.fillStyle = '#ffa502';
    ctx.fillText('HAIR', bx + 4, hairY - 2);

    // Eye level line + eye circles
    var eyeY = by + bh * 0.42;
    ctx.strokeStyle = '#5CE1E6';
    ctx.beginPath(); ctx.moveTo(bx + 4, eyeY); ctx.lineTo(bx + bw - 4, eyeY); ctx.stroke();
    ctx.setLineDash([]);
    // Left eye circle
    ctx.beginPath(); ctx.arc(cx - bw * 0.18, eyeY, bw * 0.06, 0, Math.PI * 2); ctx.stroke();
    // Right eye circle
    ctx.beginPath(); ctx.arc(cx + bw * 0.18, eyeY, bw * 0.06, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#5CE1E6';
    ctx.fillText('EYES', bx + 4, eyeY - 4);

    // Nose
    var noseY = by + bh * 0.58;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(cx, eyeY + bw * 0.08); ctx.lineTo(cx, noseY); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, noseY, bw * 0.04, 0, Math.PI * 2); ctx.stroke();

    // Mouth line
    var mouthY = by + bh * 0.72;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(cx - bw * 0.12, mouthY); ctx.lineTo(cx + bw * 0.12, mouthY); ctx.stroke();

    // Skin sample points
    var skinY = by + bh * 0.5;
    ctx.setLineDash([]);
    ctx.fillStyle = '#f0a050';
    ctx.beginPath(); ctx.arc(cx - bw * 0.25, skinY, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + bw * 0.25, skinY, 3, 0, Math.PI * 2); ctx.fill();
    ctx.font = '8px sans-serif';
    ctx.fillText('SKIN', cx + bw * 0.25 + 5, skinY + 3);

    ctx.globalAlpha = 1.0;
    ctx.setLineDash([]);
  }
}

// --- Face analysis helpers ---
function scanRow(y, x1, x2) {
  var row = [];
  y = Math.round(y); x1 = Math.round(x1); x2 = Math.round(x2);
  if (!imgCtx || isNaN(y) || isNaN(x1) || isNaN(x2)) return row;
  var cw = imgCtx.canvas.width, ch = imgCtx.canvas.height;
  if (y < 0 || y >= ch) return row;
  x1 = Math.max(0, x1); x2 = Math.min(cw - 1, x2);
  for (var x = x1; x <= x2; x++) {
    var d = imgCtx.getImageData(x, y, 1, 1).data;
    row.push([d[0], d[1], d[2]]);
  }
  return row;
}

function isSkinLike(rgb, skinRef, tolerance) {
  tolerance = tolerance || 60;
  return colorDist(rgb, skinRef) < tolerance;
}

function findSkinEdges(row, skinRef, tol) {
  var left = -1, right = -1;
  for (var i = 0; i < row.length; i++) {
    if (isSkinLike(row[i], skinRef, tol)) { if (left === -1) left = i; right = i; }
  }
  return [left, right];
}

function regionAvgColor(rx1, ry1, rx2, ry2) {
  var r = 0, g = 0, b = 0, c = 0;
  rx1 = Math.round(rx1); ry1 = Math.round(ry1); rx2 = Math.round(rx2); ry2 = Math.round(ry2);
  if (!imgCtx || isNaN(rx1) || isNaN(ry1)) return [128,128,128];
  var cw = imgCtx.canvas.width, ch = imgCtx.canvas.height;
  rx1 = Math.max(0, rx1); ry1 = Math.max(0, ry1); rx2 = Math.min(cw-1, rx2); ry2 = Math.min(ch-1, ry2);
  var step = Math.max(1, Math.round((rx2 - rx1) / 20));
  for (var y = ry1; y <= ry2; y += step) {
    for (var x = rx1; x <= rx2; x += step) {
      var d = imgCtx.getImageData(x, y, 1, 1).data;
      r += d[0]; g += d[1]; b += d[2]; c++;
    }
  }
  return c > 0 ? [Math.round(r/c), Math.round(g/c), Math.round(b/c)] : [128,128,128];
}

function regionVariance(rx1, ry1, rx2, ry2) {
  var pixels = [];
  var step = Math.max(1, Math.round((rx2 - rx1) / 15));
  for (var y = ry1; y <= ry2; y += step) {
    for (var x = rx1; x <= rx2; x += step) {
      var d = imgCtx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
      pixels.push((d[0] + d[1] + d[2]) / 3);
    }
  }
  if (pixels.length < 2) return 0;
  var mean = 0;
  for (var i = 0; i < pixels.length; i++) mean += pixels[i];
  mean /= pixels.length;
  var variance = 0;
  for (var i = 0; i < pixels.length; i++) variance += (pixels[i] - mean) * (pixels[i] - mean);
  return Math.sqrt(variance / pixels.length);
}

function regionDarkness(rx1, ry1, rx2, ry2, skinRef) {
  var avg = regionAvgColor(rx1, ry1, rx2, ry2);
  var skinBright = (skinRef[0] + skinRef[1] + skinRef[2]) / 3;
  var regionBright = (avg[0] + avg[1] + avg[2]) / 3;
  return Math.max(0, (skinBright - regionBright) / skinBright);
}

function fc(v) { return Math.max(-1, Math.min(1, v)); }
function r2(v) { return Math.round(v * 20) / 20; }

// Skin tone from RGB — handles game lighting (tinted, dark scenes)
// Uses luminance + warmth + saturation to estimate regardless of ambient light color
function rgbToSkinTone(rgb) {
  var r = rgb[0], g = rgb[1], b = rgb[2];
  // Perceived luminance
  var lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
  // Warmth: how much warmer (redder) than cool (bluer)
  var warmth = Math.max(0, (r - b)) / 255;
  // Saturation indicator: skin has moderate saturation, darker skin less so
  var maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
  var sat = maxC > 0 ? (maxC - minC) / maxC : 0;
  // Normalize: remove ambient light tint by looking at ratios not absolutes
  // Red-green ratio: lighter skin has higher r/g ratio, darker skin more even
  var rgRatio = g > 0 ? r / g : 1;
  // Combine signals:
  // - Luminance (40%): brighter face = likely lighter skin (after user adjusts brightness)
  // - Warmth (25%): warm skin = lighter tones
  // - R/G ratio (20%): higher = lighter skin
  // - Saturation (15%): moderate sat = lighter, low sat = darker
  var score = lum * 0.40 + warmth * 0.25 + Math.min(1, (rgRatio - 0.8) * 2) * 0.20 + sat * 0.15;
  return Math.round(Math.max(0, Math.min(100, score * 130 - 5)));
}

var lastFaceBox = null;
var lastSkinBlob = null;
function reExtract() {
  if (lastFaceBox) {
    // Restore the skin blob so extraction uses the same reference points
    if (lastSkinBlob) window._skinBlob = lastSkinBlob;
    extractFromFaceBox(lastFaceBox[0], lastFaceBox[1], lastFaceBox[2], lastFaceBox[3]);
  }
}

// --- Auto face detection via skin color ---
function autoDetectFace() {
  if (!imgCtx || !imgLoaded) { toast('Upload an image first', 'warn'); return; }

  // Reset to original image first (prevents stacking adjustments on re-detect)
  if (window._origImageData) {
    var canvas = document.getElementById('imgCanvas');
    imgCtx.putImageData(window._origImageData, 0, 0);
    // Reset slider displays
    var bEl = document.getElementById('adjBright');
    var gEl = document.getElementById('adjGamma');
    var cEl = document.getElementById('adjContrast');
    var hEl = document.getElementById('adjHue');
    if (bEl) bEl.value = 0;
    if (gEl) gEl.value = 0;
    if (cEl) cEl.value = 0;
    if (hEl) hEl.value = 0;
    var bV = document.getElementById('adjBrightVal');
    var gV = document.getElementById('adjGammaVal');
    var cV = document.getElementById('adjContrastVal');
    var hV = document.getElementById('adjHueVal');
    if (bV) bV.textContent = '0';
    if (gV) gV.textContent = '0';
    if (cV) cV.textContent = '0';
    if (hV) hV.textContent = '0';
  }

  var canvas = document.getElementById('imgCanvas');
  var cw = canvas.width, ch = canvas.height;

  // Step 0: Auto-brightness — analyze ORIGINAL image and boost if too dark
  var sampleData = imgCtx.getImageData(0, 0, cw, ch);
  var sd = sampleData.data;
  var totalBright = 0, sampleCount = 0;
  var step8 = Math.max(1, Math.round(cw * ch / 5000)); // sample ~5000 pixels
  for (var i = 0; i < sd.length; i += step8 * 4) {
    totalBright += (sd[i] * 0.299 + sd[i+1] * 0.587 + sd[i+2] * 0.114);
    sampleCount++;
  }
  var avgBright = totalBright / sampleCount;
  console.log('Image avg brightness:', Math.round(avgBright));

  // If dark (< 90 avg), auto-boost. Target ~110 average brightness.
  if (avgBright < 90 && window._origImageData) {
    var targetBright = 110;
    var boostNeeded = targetBright - avgBright;
    // Calculate adjustment values
    var autoBrightness = Math.round(Math.min(80, boostNeeded * 0.8));
    var autoGamma = Math.round(Math.min(60, boostNeeded * 0.5));
    var autoContrast = Math.round(Math.min(30, boostNeeded * 0.2));

    console.log('Auto-adjusting: brightness=' + autoBrightness + ' gamma=' + autoGamma + ' contrast=' + autoContrast);

    // Set the sliders visually
    var bEl = document.getElementById('adjBright');
    var gEl = document.getElementById('adjGamma');
    var cEl = document.getElementById('adjContrast');
    if (bEl) bEl.value = autoBrightness;
    if (gEl) gEl.value = autoGamma;
    if (cEl) cEl.value = autoContrast;
    // Apply the adjustments
    applyImgAdjust();

    toast('Dark image detected — auto-brightened', 'info');
  }

  var imgData = imgCtx.getImageData(0, 0, cw, ch);
  var d = imgData.data;

  // Step 1: Build skin probability map
  // Skin pixels in game screenshots: warm tones, moderate brightness
  var skinMap = new Uint8Array(cw * ch);
  for (var i = 0; i < d.length; i += 4) {
    var r = d[i], g = d[i+1], b = d[i+2];
    // Multiple skin detection rules (works across skin tones):
    // Rule 1: RGB ratio based — R > G > B, with warmth
    // Rule 2: HSV based — hue between 0-50 degrees, moderate saturation
    var maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
    var bright = (r + g + b) / 3;
    var sat = maxC > 0 ? (maxC - minC) / maxC : 0;

    var isSkin = false;

    // Compute hue (0-360) for red/pink hair exclusion
    var hue = 0;
    if (maxC > minC) {
      var delta = maxC - minC;
      if (maxC === r) hue = 60 * (((g - b) / delta) % 6);
      else if (maxC === g) hue = 60 * ((b - r) / delta + 2);
      else hue = 60 * ((r - g) / delta + 4);
      if (hue < 0) hue += 360;
    }

    // Reject red/pink/magenta hair: high saturation + red-dominant hue + bright
    // Real skin: hue 15-50, sat 0.1-0.45, any brightness. Red hair: hue 0-15, sat 0.4+, bright
    // Dark skin has moderate sat + low brightness — must NOT be excluded
    var isRedHair = bright > 90 && sat > 0.45 && ((hue < 16 || hue > 345) && r > g * 1.5);
    // Also catch vivid pink/magenta: hue 290-345, high sat, bright
    var isPinkHair = bright > 90 && sat > 0.38 && hue > 290 && hue < 345 && r > b * 0.8;

    // Warm skin: R highest, G second, not too saturated, not too dark/bright
    if (!isRedHair && !isPinkHair &&
        r > 50 && g > 30 && b > 20 &&
        r > g && g > b &&
        r - g > 5 && r - b > 15 &&
        bright > 40 && bright < 230 &&
        sat > 0.05 && sat < 0.65) {
      isSkin = true;
    }
    // Also catch lighter skin where R and G are close
    if (!isSkin && !isRedHair && !isPinkHair &&
        r > 100 && g > 80 && b > 60 &&
        r >= g && r - b > 10 &&
        bright > 80 && bright < 240 &&
        sat > 0.03 && sat < 0.5) {
      isSkin = true;
    }
    skinMap[(i/4)] = isSkin ? 1 : 0;
  }

  // Step 2: Find blobs using flood fill — keep multiple candidates
  var visited = new Uint8Array(cw * ch);
  var blobs = [];
  var step = Math.max(2, Math.round(Math.max(cw, ch) / 250)); // scale step with image size

  for (var y = 0; y < ch; y += step) {
    for (var x = 0; x < cw; x += step) {
      var idx = y * cw + x;
      if (!skinMap[idx] || visited[idx]) continue;

      var queue = [[x, y]];
      var blobMinX = x, blobMaxX = x, blobMinY = y, blobMaxY = y;
      var blobSize = 0;
      visited[idx] = 1;

      while (queue.length > 0) {
        var pt = queue.shift();
        var px = pt[0], py = pt[1];
        blobSize++;
        if (px < blobMinX) blobMinX = px;
        if (px > blobMaxX) blobMaxX = px;
        if (py < blobMinY) blobMinY = py;
        if (py > blobMaxY) blobMaxY = py;

        var neighbors = [[px-step,py],[px+step,py],[px,py-step],[px,py+step]];
        for (var n = 0; n < 4; n++) {
          var nx = neighbors[n][0], ny = neighbors[n][1];
          if (nx < 0 || ny < 0 || nx >= cw || ny >= ch) continue;
          var nIdx = ny * cw + nx;
          if (!skinMap[nIdx] || visited[nIdx]) continue;
          visited[nIdx] = 1;
          queue.push([nx, ny]);
        }
      }

      if (blobSize > 30) {
        blobs.push({ x1: blobMinX, y1: blobMinY, x2: blobMaxX, y2: blobMaxY, size: blobSize });
      }
    }
  }

  if (blobs.length === 0) {
    toast('No face detected — try drawing a box manually', 'warn');
    return;
  }

  // Step 3: Score blobs — best face blob is:
  // - Portrait shaped, not at screen edges (HUD), reasonably sized
  var bestBlob = null, bestScore = -Infinity;
  for (var bi = 0; bi < blobs.length; bi++) {
    var b = blobs[bi];
    var bw = b.x2 - b.x1, bh = b.y2 - b.y1;
    var aspect = bh / Math.max(1, bw);
    var widthRatio = bw / cw;
    var bCenterX = (b.x1 + b.x2) / 2 / cw; // 0-1, center of blob horizontally
    var bCenterY = (b.y1 + b.y2) / 2 / ch; // 0-1, center of blob vertically

    // Reject blobs wider than 50% of image
    if (widthRatio > 0.50) continue;
    // Reject very flat blobs
    if (aspect < 0.6) continue;
    // Reject tiny blobs
    if (b.size < 80) continue;

    // === POSITION IS KING ===
    // In GTA screenshots, the character is almost always in the center-left area.
    // UI panels are on the right (>60% x), HUD is bottom-left/corners.
    // Position matters MORE than size.

    var xCenter = Math.abs(bCenterX - 0.35); // face typically slightly left of center
    var yCenter = Math.abs(bCenterY - 0.38); // face typically in upper-middle

    // Base score from position (0-1000 scale, position dominant)
    var posScore = Math.max(0, (1 - xCenter * 2.5)) * 500 + Math.max(0, (1 - yCenter * 2.5)) * 300;

    // Size adds some (but not dominant)
    var score = posScore + Math.min(b.size, 400) * 0.3;

    // Portrait shape bonus
    score += (aspect > 1.0 ? 40 : aspect * 40);

    // === HARD REJECTIONS ===
    // Right side of screen (>60% x) — likely UI panel with ped thumbnails
    if (bCenterX > 0.60) score -= 600;
    // Bottom-left (minimap)
    if (bCenterY > 0.7 && bCenterX < 0.25) score -= 600;
    // Bottom-right
    if (bCenterY > 0.7 && bCenterX > 0.75) score -= 600;
    // Very bottom (health bars)
    if (bCenterY > 0.85) score -= 500;
    // Very top or side edges
    if (bCenterY < 0.08) score -= 300;
    if (bCenterX < 0.05 || bCenterX > 0.95) score -= 400;
    // Width penalty
    score -= widthRatio * 150;

    // === EYE PRESENCE CHECK ===
    // A real face has two dark spots (eyes/pupils) at ~42% down the blob
    // Check if this blob has that feature — big bonus if yes
    if (bw > 15 && bh > 20) {
      var eyeCheckY = Math.round(b.y1 + bh * 0.42);
      var blobCx = Math.round((b.x1 + b.x2) / 2);
      var eyeCheckLx = Math.round(blobCx - bw * 0.18);
      var eyeCheckRx = Math.round(blobCx + bw * 0.18);
      // Sample brightness at expected eye positions and compare to surrounding skin
      var skinCheckY = Math.round(b.y1 + bh * 0.5); // cheek area for comparison
      var skinBrCheck = 0, eyeLBr = 0, eyeRBr = 0;
      var checkCount = 0;
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          var slx = blobCx + dx, sly = skinCheckY + dy;
          var elx = eyeCheckLx + dx, ely = eyeCheckY + dy;
          var erx = eyeCheckRx + dx, ery = eyeCheckY + dy;
          if (slx >= 0 && slx < cw && sly >= 0 && sly < ch &&
              elx >= 0 && elx < cw && ely >= 0 && ely < ch &&
              erx >= 0 && erx < cw && ery >= 0 && ery < ch) {
            var sp = d[(sly * cw + slx) * 4] + d[(sly * cw + slx) * 4 + 1] + d[(sly * cw + slx) * 4 + 2];
            var elp = d[(ely * cw + elx) * 4] + d[(ely * cw + elx) * 4 + 1] + d[(ely * cw + elx) * 4 + 2];
            var erp = d[(ery * cw + erx) * 4] + d[(ery * cw + erx) * 4 + 1] + d[(ery * cw + erx) * 4 + 2];
            skinBrCheck += sp; eyeLBr += elp; eyeRBr += erp;
            checkCount++;
          }
        }
      }
      if (checkCount > 0) {
        skinBrCheck /= checkCount; eyeLBr /= checkCount; eyeRBr /= checkCount;
        // Eyes should be significantly darker than surrounding skin (at least 20% darker)
        var eyeDarkL = (skinBrCheck - eyeLBr) / Math.max(1, skinBrCheck);
        var eyeDarkR = (skinBrCheck - eyeRBr) / Math.max(1, skinBrCheck);
        var hasEyes = eyeDarkL > 0.15 && eyeDarkR > 0.15;
        if (hasEyes) {
          score += 300; // big bonus — this blob has eye-like features = likely a face
        }
      }
    }

    console.log('Blob #' + bi + ': center(' + bCenterX.toFixed(2) + ',' + bCenterY.toFixed(2) + ') size:' + b.size + ' score:' + Math.round(score));
    if (score > bestScore) { bestScore = score; bestBlob = b; }
  }

  if (!bestBlob) {
    // Fallback: just use the largest blob
    blobs.sort(function(a,b){ return b.size - a.size; });
    bestBlob = blobs[0];
  }

  // Step 4: Expand box for hair above and chin below
  var bw = bestBlob.x2 - bestBlob.x1;
  var bh = bestBlob.y2 - bestBlob.y1;
  var fx1 = Math.max(0, Math.round(bestBlob.x1 - bw * 0.08));
  var fy1 = Math.max(0, Math.round(bestBlob.y1 - bh * 0.35));
  var fx2 = Math.min(cw, Math.round(bestBlob.x2 + bw * 0.08));
  var fy2 = Math.min(ch, Math.round(bestBlob.y2 + bh * 0.08));

  // Enforce portrait aspect ratio
  var fw = fx2 - fx1, fh = fy2 - fy1;
  if (fw > fh * 0.85) {
    var targetW = Math.round(fh * 0.75);
    var centerX = (fx1 + fx2) / 2;
    fx1 = Math.max(0, Math.round(centerX - targetW / 2));
    fx2 = Math.min(cw, Math.round(centerX + targetW / 2));
  }

  // Crop/zoom the canvas display to show just the face region
  var wrap = document.getElementById('imgWrap');
  var padPercent = 0.15; // 15% padding around the face box
  var padX = (fx2 - fx1) * padPercent;
  var padY = (fy2 - fy1) * padPercent;
  var cropX1 = Math.max(0, fx1 - padX) / cw * 100;
  var cropY1 = Math.max(0, fy1 - padY) / ch * 100;
  var cropX2 = Math.min(cw, fx2 + padX) / cw * 100;
  var cropY2 = Math.min(ch, fy2 + padY) / ch * 100;
  var cropW = cropX2 - cropX1;
  var cropH = cropY2 - cropY1;
  // Use object-fit/position to crop the canvas view
  canvas.style.objectFit = 'cover';
  canvas.style.objectPosition = cropX1 + '% ' + cropY1 + '%';
  // Scale: zoom factor = 100 / smaller dimension %
  var zoomFactor = 100 / Math.min(cropW, cropH);
  canvas.style.transform = 'scale(' + Math.min(zoomFactor, 3).toFixed(2) + ')';
  canvas.style.transformOrigin = ((cropX1 + cropW/2)) + '% ' + ((cropY1 + cropH/2)) + '%';
  if (wrap) wrap.style.overflow = 'hidden';

  // Draw the detected box on overlay
  var overlay = document.getElementById('imgOverlay');
  if (overlay) {
    var displayRect = canvas.getBoundingClientRect();
    overlay.width = Math.round(displayRect.width);
    overlay.height = Math.round(displayRect.height);
    var oCtx = overlay.getContext('2d');
    var scX = displayRect.width / cw;
    var scY = displayRect.height / ch;
    oCtx.clearRect(0, 0, overlay.width, overlay.height);
    oCtx.fillStyle = 'rgba(0,0,0,0.35)';
    oCtx.fillRect(0, 0, overlay.width, overlay.height);
    oCtx.clearRect(fx1*scX, fy1*scY, (fx2-fx1)*scX, (fy2-fy1)*scY);
    oCtx.strokeStyle = '#7B68EE';
    oCtx.lineWidth = 2;
    oCtx.strokeRect(fx1*scX, fy1*scY, (fx2-fx1)*scX, (fy2-fy1)*scY);
    oCtx.font = '10px sans-serif';
    oCtx.fillStyle = '#7B68EE';
    oCtx.fillText('AUTO-DETECTED', fx1*scX + 4, fy1*scY + 12);
  }

  // === EYE-PAIR FALLBACK ===
  // If best blob is too large or has wrong aspect, try finding eye pairs directly
  var blobArea = (bestBlob.x2 - bestBlob.x1) * (bestBlob.y2 - bestBlob.y1);
  var imgArea = cw * ch;
  var blobRatio = blobArea / imgArea;
  var blobAspect = (bestBlob.y2 - bestBlob.y1) / Math.max(1, bestBlob.x2 - bestBlob.x1);

  var _originalBlobUnreliable = false;
  window._blobUnreliableContext = false;
  if (blobRatio > 0.10 || blobAspect > 2.5) {
    _originalBlobUnreliable = true;
    window._blobUnreliableContext = true; // persists across extractFromFaceBox calls
    console.log('Blob unreliable (ratio=' + (blobRatio*100).toFixed(1) + '% aspect=' + blobAspect.toFixed(2) + ') — trying eye-pair scan');
    // Scan for pairs of dark spots across the image
    // Eyes appear as two dark regions at the same Y, separated by 5-15% of image width
    var eyePairBest = null, eyePairBestScore = 0;
    var scanStep = Math.max(4, Math.round(Math.max(cw, ch) / 120));
    var minEyeGap = Math.round(cw * 0.03);
    var maxEyeGap = Math.round(cw * 0.10); // tighter max — 10% of image width (was 15%)

    for (var sy = Math.round(ch * 0.1); sy < Math.round(ch * 0.7); sy += scanStep) {
      // Build brightness profile for this row
      var rowBright = [];
      for (var sx = Math.round(cw * 0.05); sx < Math.round(cw * 0.65); sx += scanStep) {
        var pidx = (sy * cw + sx) * 4;
        rowBright.push({x: sx, b: (d[pidx] + d[pidx+1] + d[pidx+2]) / 3});
      }

      // Find pairs of dark dips (potential eye locations)
      for (var li = 0; li < rowBright.length; li++) {
        if (rowBright[li].b > 100) continue; // not dark enough for an eye region
        for (var ri = li + 1; ri < rowBright.length; ri++) {
          if (rowBright[ri].b > 100) continue;
          var gap = rowBright[ri].x - rowBright[li].x;
          if (gap < minEyeGap || gap > maxEyeGap) continue;

          // Both "eye" spots must be within the skin blob bounds
          if (rowBright[li].x < bestBlob.x1 || rowBright[ri].x > bestBlob.x2 ||
              sy < bestBlob.y1 || sy > bestBlob.y2) continue;

          // Verify both spots are on or near skin-colored pixels
          var lIdx = (sy * cw + rowBright[li].x) * 4;
          var rIdx = (sy * cw + rowBright[ri].x) * 4;
          // Sample skin near each eye (slightly above — forehead should be skin)
          var skinCheckY = Math.max(0, sy - Math.round(gap * 0.3));
          var lSkinIdx = (skinCheckY * cw + rowBright[li].x) * 4;
          var rSkinIdx = (skinCheckY * cw + rowBright[ri].x) * 4;
          var lSkin = skinMap[skinCheckY * cw + rowBright[li].x];
          var rSkin = skinMap[skinCheckY * cw + rowBright[ri].x];
          // At least one side above the "eye" must be skin
          if (!lSkin && !rSkin) continue;

          // Check that the area BETWEEN the eyes is brighter (nose bridge)
          var midX = Math.round((rowBright[li].x + rowBright[ri].x) / 2);
          var midIdx = (sy * cw + midX) * 4;
          var midBright = (d[midIdx] + d[midIdx+1] + d[midIdx+2]) / 3;
          var bridgeDiff = midBright - (rowBright[li].b + rowBright[ri].b) / 2;

          // Check that area ABOVE the eyes (forehead) is brighter (skin)
          var aboveY = Math.max(0, sy - Math.round(gap * 0.5));
          var aboveIdx = (aboveY * cw + midX) * 4;
          var aboveBright = (d[aboveIdx] + d[aboveIdx+1] + d[aboveIdx+2]) / 3;
          var foreheadDiff = aboveBright - (rowBright[li].b + rowBright[ri].b) / 2;

          // Check BELOW the eyes is also skin (cheeks)
          var belowY = Math.min(ch - 1, sy + Math.round(gap * 0.4));
          var belowSkin = skinMap[belowY * cw + midX];
          if (!belowSkin) continue; // no skin below = not a face

          // Score: darkness of eyes + brightness of bridge + brightness of forehead
          var epScore = bridgeDiff * 2 + foreheadDiff * 1.5 + (100 - rowBright[li].b) + (100 - rowBright[ri].b);
          // Center bias: faces are usually in the upper-center of GTA screenshots
          var epCxNorm = midX / cw; // 0..1 horizontal position
          var epCyNorm = sy / ch;   // 0..1 vertical position
          // Target (0.35, 0.30) — faces are typically upper-left to center in GTA screenshots
          // Horizontal weight is less (faces can be anywhere left-right)
          // Vertical weight is more (faces are almost always in upper 50%)
          var centerDist = Math.sqrt(Math.pow((epCxNorm - 0.35) * 0.8, 2) + Math.pow((epCyNorm - 0.30) * 1.5, 2));
          epScore += (0.5 - centerDist) * 400;

          if (epScore > eyePairBestScore) {
            eyePairBestScore = epScore;
            eyePairBest = {
              lx: rowBright[li].x, rx: rowBright[ri].x, y: sy,
              gap: gap, score: epScore
            };
          }
        }
      }
    }

    if (eyePairBest && eyePairBestScore > 60) {
      console.log('Eye pair found! L(' + eyePairBest.lx + ',' + eyePairBest.y + ') R(' + eyePairBest.rx + ',' + eyePairBest.y + ') gap=' + eyePairBest.gap + ' score=' + Math.round(eyePairBest.score));
      // Construct a face box from the eye pair
      var epCx = (eyePairBest.lx + eyePairBest.rx) / 2;
      var epGap = eyePairBest.gap;
      var faceW = epGap * 2.5; // face is ~2.5x the eye gap
      var faceH = faceW * 1.4; // face is taller than wide
      // Eyes are at ~42% down the face
      var faceTop = eyePairBest.y - faceH * 0.42;
      bestBlob = {
        x1: Math.max(0, Math.round(epCx - faceW / 2)),
        y1: Math.max(0, Math.round(faceTop)),
        x2: Math.min(cw, Math.round(epCx + faceW / 2)),
        y2: Math.min(ch, Math.round(faceTop + faceH))
      };
      // Recalculate
      blobArea = (bestBlob.x2 - bestBlob.x1) * (bestBlob.y2 - bestBlob.y1);
      blobRatio = blobArea / imgArea;
      blobAspect = (bestBlob.y2 - bestBlob.y1) / Math.max(1, bestBlob.x2 - bestBlob.x1);
      console.log('Eye-pair face box:', bestBlob, 'ratio=' + (blobRatio*100).toFixed(1) + '%');
    } else {
      console.log('No eye pair found (best score: ' + Math.round(eyePairBestScore) + ')');
    }
  }

  // Recalculate expanded box (may have changed from eye-pair fallback)
  var bw2 = bestBlob.x2 - bestBlob.x1;
  var bh2 = bestBlob.y2 - bestBlob.y1;
  fx1 = Math.max(0, Math.round(bestBlob.x1 - bw2 * 0.08));
  fy1 = Math.max(0, Math.round(bestBlob.y1 - bh2 * 0.35));
  fx2 = Math.min(cw, Math.round(bestBlob.x2 + bw2 * 0.08));
  fy2 = Math.min(ch, Math.round(bestBlob.y2 + bh2 * 0.08));
  var fw2 = fx2 - fx1, fh2 = fy2 - fy1;
  if (fw2 > fh2 * 0.85) {
    var tw = Math.round(fh2 * 0.75);
    var tcx = (fx1 + fx2) / 2;
    fx1 = Math.max(0, Math.round(tcx - tw / 2));
    fx2 = Math.min(cw, Math.round(tcx + tw / 2));
  }
  console.log('Auto-detect: skinBlob', bestBlob, 'blobRatio=' + (blobRatio*100).toFixed(1) + '% aspect=' + blobAspect.toFixed(2), 'expanded box', {fx1:fx1,fy1:fy1,fx2:fx2,fy2:fy2});

  // If blob covers >12% of image, very tall, OR original blob was unreliable → manual box
  if (blobRatio > 0.12 || blobAspect > 2.5 || _originalBlobUnreliable) {
    console.log('Blob too large — likely includes body. Prompting user to draw box.');
    toast('Face area too large — drag the eye markers onto the eyes, or draw a box', 'warn');
    showEyeMarkers(eyePairBest || null, bestBlob || null);
    // If markers were placed from detected eye pair, auto-extract immediately (keep markers visible)
    // Re-set _blobTooLarge before extracting — the first extractFromFaceBox clears it
    if (eyePairBest) {
      setTimeout(function() { window._autoExtractPass = true; window._blobTooLarge = true; extractFromMarkers(); }, 150);
    }

    if (overlay) {
      var oCtx2 = overlay.getContext('2d');
      oCtx2.font = 'bold 12px sans-serif';
      oCtx2.fillStyle = '#ffa502';
      oCtx2.fillText('TOO LARGE — Draw a tighter box around the face', fx1*scX + 4, fy1*scY + 26);
    }

    // Flag that blob is too large — extraction will skip eye/hair color
    window._blobTooLarge = true;
    window._skinBlob = bestBlob;
    lastSkinBlob = bestBlob;
    // Run extraction to get auto-detect colors (will be stored before skipping)
    window._storeAutoDetectColors = true;
    extractFromFaceBox(fx1, fy1, fx2, fy2);

    // Reset zoom so user can draw a manual box on the full image
    var canvasEl = document.getElementById('imgCanvas');
    if (canvasEl) { canvasEl.style.transform = ''; canvasEl.style.transformOrigin = ''; canvasEl.style.objectFit = ''; canvasEl.style.objectPosition = ''; }
    var wrapEl = document.getElementById('imgWrap');
    if (wrapEl) wrapEl.style.overflow = '';
    return;
  }
  window._blobTooLarge = false;
  hideEyeMarkers();

  toast('Face detected! Extracting...', 'info');
  window._skinBlob = bestBlob;
  lastSkinBlob = bestBlob;
  extractFromFaceBox(fx1, fy1, fx2, fy2);
}

function extractFromFaceBox(x1, y1, x2, y2) {
  lastFaceBox = [x1, y1, x2, y2];
  var reBtn = document.getElementById('reExtractBtn');
  if (reBtn) reBtn.style.display = 'inline-block';
  var w = x2 - x1, h = y2 - y1;

  // Use skin blob bounds if available (from auto-detect), otherwise use box
  var sb = window._skinBlob || {x1: x1, y1: y1, x2: x2, y2: y2};
  var sw = sb.x2 - sb.x1, sh = sb.y2 - sb.y1;

  // Truncate blob to face-only if it's too tall (includes body)
  // A face is roughly 1:1.4 ratio. If blob height > 2x width, it includes neck/body.
  // Crop to top portion = face only
  var maxFaceHeight = sw * 1.6;
  if (sh > maxFaceHeight) {
    console.log('Skin blob too tall (' + sh + 'px, width ' + sw + 'px) — cropping to face-only (' + Math.round(maxFaceHeight) + 'px)');
    sh = maxFaceHeight;
    sb = {x1: sb.x1, y1: sb.y1, x2: sb.x2, y2: sb.y1 + Math.round(sh)};
  }

  var cx = sb.x1 + sw * 0.5;
  var cy = sb.y1 + sh * 0.5;
  // Save for re-extract, but clear active so manual box draws use box edges
  if (window._skinBlob) lastSkinBlob = window._skinBlob;
  window._skinBlob = null;

  console.log('Face center:', {cx: Math.round(cx), cy: Math.round(cy), sw: sw, sh: Math.round(sh), blobOrigH: (sb.y2 - sb.y1)});

  // ====== COLOR EXTRACTION ======
  // Skin: sample from cheek area relative to skin blob center
  var skinL = sampleArea(Math.round(cx - sw * 0.25), Math.round(cy + sh * 0.05), 8);
  var skinR = sampleArea(Math.round(cx + sw * 0.25), Math.round(cy + sh * 0.05), 8);
  var skinRgb = [
    Math.round((skinL[0]+skinR[0])/2),
    Math.round((skinL[1]+skinR[1])/2),
    Math.round((skinL[2]+skinR[2])/2)
  ];
  // Override with marker colors if available
  if (window._markerColors && window._markerColors.skin) {
    skinRgb = window._markerColors.skin;
    console.log('Skin overridden by marker:', skinRgb);
  }
  console.log('Skin sampled:', skinRgb);

  // Hair: sample WITHIN the top 5-15% of the skin blob (forehead/hairline area)
  // NOT above the blob — that's background/UI/logos
  var hairSamples = [];
  var hairTop = sb.y1 + Math.round(sh * 0.02);
  var hairBot = sb.y1 + Math.round(sh * 0.12);
  for (var hy = hairTop; hy <= hairBot; hy += Math.max(1, Math.round((hairBot-hairTop)/5))) {
    for (var hxOff = -0.3; hxOff <= 0.3; hxOff += 0.15) {
      var hpx = Math.round(cx + sw * hxOff);
      if (hpx >= 0 && hpx < imgCtx.canvas.width && hy >= 0) {
        hairSamples.push(sampleArea(hpx, hy, 3));
      }
    }
  }
  // Score: favor colorful + bright + NOT skin-like + NOT gray
  var hairRgb = hairSamples.length > 0 ? hairSamples[0] : [80, 60, 40]; // safe default
  var hairBest = -Infinity;
  for (var hi = 0; hi < hairSamples.length; hi++) {
    var hr = hairSamples[hi][0], hg = hairSamples[hi][1], hb = hairSamples[hi][2];
    var hBright = (hr + hg + hb) / 3;
    var hMax = Math.max(hr, hg, hb), hMin = Math.min(hr, hg, hb);
    var hSat = hMax > 0 ? (hMax - hMin) / hMax : 0;
    var hSkinDist = colorDist(hairSamples[hi], skinRgb);
    var hGrayness = Math.abs(hr - hg) + Math.abs(hg - hb);

    // Reject very dark pixels (background/shadow)
    if (hBright < 25) continue;
    // Reject very bright white pixels (UI elements)
    if (hBright > 240 && hSat < 0.08) continue;
    // Reject blue/purple/cyan pixels — these are UI/background, never natural hair
    if (hb > hr && hb > hg) continue; // blue dominant = not hair
    if (hb > hr * 1.3) continue; // significantly more blue than red = UI element

    // Score: favor warm tones (natural hair is always warm — red >= blue)
    var hScore = hSat * 200 + hSkinDist * 0.5 + hGrayness * 0.5 + (hBright > 50 ? 20 : 0);
    if (hScore > hairBest) { hairBest = hScore; hairRgb = hairSamples[hi]; }
  }
  // If no good hair found, pick brightest sample
  if (hairBest === -Infinity && hairSamples.length > 0) {
    var bestB = 0;
    for (var hi = 0; hi < hairSamples.length; hi++) {
      var b = hairSamples[hi][0] + hairSamples[hi][1] + hairSamples[hi][2];
      if (b > bestB) { bestB = b; hairRgb = hairSamples[hi]; }
    }
  }
  // Hair marker override is handled after eye scoring (with auto-detect fallback)

  // Eyes: ~37% down from top of skin blob, ~18% left/right of center
  // At low resolution, iris is tiny (3-5px). Scan every single pixel in a tight zone.
  var eyeSamples = [];
  var eyeCy = Math.round(sb.y1 + sh * 0.42); // GTA V eyes are lower than real face proportions
  var eyeLx = Math.round(cx - sw * 0.18);
  var eyeRx = Math.round(cx + sw * 0.18);
  var eyeRadius = Math.max(5, Math.round(sw * 0.07)); // scan radius — larger at higher res
  var eyeStep = eyeRadius > 15 ? 2 : 1; // skip every other pixel at very high res
  console.log('Eye positions: L(' + eyeLx + ',' + eyeCy + ') R(' + eyeRx + ',' + eyeCy + ') radius:' + eyeRadius + ' skinBlob top:' + sb.y1 + ' bot:' + sb.y2);
  // Single-pixel sampling — scan every pixel in the eye zone
  var eyeCenters = [eyeLx, eyeRx];
  for (var ec = 0; ec < eyeCenters.length; ec++) {
    var ecx = eyeCenters[ec];
    for (var dy = -eyeRadius; dy <= eyeRadius; dy += eyeStep) {
      for (var dx = -eyeRadius; dx <= eyeRadius; dx += eyeStep) {
        var px = ecx + dx, py = eyeCy + dy;
        if (px < 0 || py < 0 || px >= imgCtx.canvas.width || py >= imgCtx.canvas.height) continue;
        var pd = imgCtx.getImageData(px, py, 1, 1).data;
        eyeSamples.push({rgb: [pd[0], pd[1], pd[2]], x: px, y: py});
      }
    }
  }

  // Safe default
  var eyeRgb = [100, 140, 180];
  if (eyeSamples.length > 0 && eyeSamples[0].rgb) eyeRgb = eyeSamples[0].rgb;

  // Score: iris pixels are the most COLORFUL and DIFFERENT FROM SKIN pixels
  // They are NOT: dark (lashes/pupil), white (sclera), or skin-colored
  // Strategy: find the pixel with highest color uniqueness in the eye zone
  var eyeBestScore = -Infinity;
  var eyeDebug = [];
  for (var ei = 0; ei < eyeSamples.length; ei++) {
    var es = eyeSamples[ei].rgb;
    if (!es) continue;
    var er = es[0], eg = es[1], eb = es[2];
    var eBright = (er + eg + eb) / 3;
    var eMax = Math.max(er, eg, eb), eMin = Math.min(er, eg, eb);
    var eSat = eMax > 0 ? (eMax - eMin) / eMax : 0;
    var eSkinDist = colorDist(es, skinRgb);

    // Reject pure black (pupil, lashes) and pure white/bright gray (sclera, specular)
    var rejected = (eBright < 30 || eBright > 190);
    // Also reject near-gray with no color — sclera (sat < 0.05 and bright > 120)
    if (eSat < 0.05 && eBright > 120) rejected = true;

    // Score: iris pixel = colored, moderate brightness, NOT skin/lash/sclera
    var score = 0;
    score += eSat * 200;           // colorfulness matters
    score += eSkinDist * 0.5;      // different from skin

    // STRONG bonus for non-warm colors (blue, green, gray-blue)
    // These are eye colors — skin/lashes are always warm (red > blue)
    if (eb > er) score += 150;     // blue dominant = very likely iris
    if (eb > er * 0.9 && eBright > 50) score += 60; // near-blue also good
    if (eg > er && eg > eb) score += 80; // green eyes

    // Penalty for warm colors (skin, lash, shadow are all warm)
    if (er > eb * 1.5 && er > eg) score -= 80; // very warm = skin/lash
    if (eSkinDist < 15) score -= 100;
    // Penalty for very dark (lash/shadow)
    if (eBright < 50) score -= 80;
    // Penalty for desaturated
    if (eSat < 0.08) score -= 100;
    if (eSat < 0.15) score -= 30;
    // Sweet spot: moderate brightness
    if (eBright > 55 && eBright < 160) score += 30;
    // Extra penalty for bright desaturated (sclera)
    if (eBright > 140 && eSat < 0.1) score -= 80;

    if (eyeDebug.length < 12 || score > eyeBestScore - 20) {
      eyeDebug.push({x: eyeSamples[ei].x, y: eyeSamples[ei].y, rgb: es, bright: Math.round(eBright), sat: eSat.toFixed(2), skinDist: Math.round(eSkinDist), score: Math.round(score), rejected: rejected});
    }

    if (!rejected && score > eyeBestScore) {
      eyeBestScore = score;
      eyeRgb = es;
    }
  }

  // Fallback: pick brightest non-skin pixel
  if (eyeBestScore === -Infinity) {
    var bestBright = 0;
    for (var ei = 0; ei < eyeSamples.length; ei++) {
      if (!eyeSamples[ei].rgb) continue;
      var b = eyeSamples[ei].rgb[0] + eyeSamples[ei].rgb[1] + eyeSamples[ei].rgb[2];
      var sd = colorDist(eyeSamples[ei].rgb, skinRgb);
      if (b > bestBright && sd > 15 && b < 650) { bestBright = b; eyeRgb = eyeSamples[ei].rgb; }
    }
  }

  // Store auto-detect colors before blob-too-large skips them
  // These serve as fallback when marker sampling finds worse results
  if (window._storeAutoDetectColors) {
    window._autoDetectColors = {
      eye: eyeRgb.slice(), eyeScore: eyeBestScore,
      hair: hairRgb.slice(), skin: skinRgb.slice()
    };
    console.log('Auto-detect colors stored: eye=' + rgbToHex(eyeRgb[0],eyeRgb[1],eyeRgb[2]) + ' score=' + Math.round(eyeBestScore) + ' hair=' + rgbToHex(hairRgb[0],hairRgb[1],hairRgb[2]));
    window._storeAutoDetectColors = false;
  }

  // Override with marker colors, but only if better than auto-detect
  if (window._markerColors && window._markerColors.eye) {
    // Compare marker eye vs auto-detect eye — use whichever scored better
    var autoEye = window._autoDetectColors;
    if (autoEye && autoEye.eyeScore > eyeBestScore + 50) {
      eyeRgb = autoEye.eye;
      console.log('Eye: auto-detect was better (score ' + Math.round(autoEye.eyeScore) + ' vs marker ' + Math.round(eyeBestScore) + '), using auto-detect:', eyeRgb);
    } else {
      eyeRgb = window._markerColors.eye;
      console.log('Eye overridden by marker:', eyeRgb);
    }
  }
  if (window._markerColors && window._markerColors.hair) {
    // Use marker hair, but fallback to auto-detect if marker found very dark pixels
    var autoHair = window._autoDetectColors;
    var markerHairBr = (window._markerColors.hair[0] + window._markerColors.hair[1] + window._markerColors.hair[2]) / 3;
    if (autoHair && markerHairBr < 60) {
      var autoHairBr = (autoHair.hair[0] + autoHair.hair[1] + autoHair.hair[2]) / 3;
      if (autoHairBr > markerHairBr + 30) {
        hairRgb = autoHair.hair;
        console.log('Hair: marker found dark pixels (' + Math.round(markerHairBr) + '), using auto-detect (' + Math.round(autoHairBr) + '):', hairRgb);
      } else {
        hairRgb = window._markerColors.hair;
        console.log('Hair overridden by marker:', hairRgb);
      }
    } else if (window._markerColors.hair) {
      hairRgb = window._markerColors.hair;
      console.log('Hair overridden by marker:', hairRgb);
    }
  }
  // Skin marker override already applied above (before eye scoring)
  // Clear marker colors after use
  window._markerColors = null;

  // ====== CONSOLE DEBUG DUMP ======
  console.log('=== PED BUILDER DEBUG ===');
  console.log('Face box:', {x1:x1, y1:y1, x2:x2, y2:y2, w:w, h:h});
  console.log('Skin sampled:', skinRgb, '→ tone:', rgbToSkinTone(skinRgb));
  console.log('Hair sampled:', hairRgb, '→ hex:', rgbToHex(hairRgb[0],hairRgb[1],hairRgb[2]));
  console.log('Eye sampled:', eyeRgb, '→ hex:', rgbToHex(eyeRgb[0],eyeRgb[1],eyeRgb[2]));
  console.log('Eye best score:', eyeBestScore);
  // Show top 5 eye candidates sorted by score
  eyeDebug.sort(function(a,b){return b.score-a.score;});
  console.log('Eye top candidates:');
  for (var di = 0; di < Math.min(8, eyeDebug.length); di++) {
    var ed = eyeDebug[di];
    console.log('  ' + (di+1) + '. RGB(' + ed.rgb.join(',') + ') score:' + ed.score + ' bright:' + ed.bright + ' sat:' + ed.sat + ' skinDist:' + ed.skinDist + (ed.rejected?' REJECTED':'') + ' @(' + ed.x.toFixed(2) + ',' + ed.y.toFixed(2) + ')');
  }
  console.log('========================');

  // ====== OBSTRUCTION DETECTION ======
  // Glasses: check if eye region has uniform tint (low variance) or all samples very similar
  var eyeObstructed = false;
  var glassesReason = '';

  // If blob was too large (body included), skip eye color — samples would be on body, not eyes
  if (window._blobTooLarge) {
    eyeObstructed = true;
    glassesReason = 'face area too large — draw a tighter box for eye color';
    console.log('Skipping eye color — blob too large (body detected)');
  }
  window._blobTooLarge = false;
  if (eyeSamples.length > 5) {
    // Check if all non-rejected eye samples are very similar (glasses lens = uniform color)
    var eyeNonRejected = [];
    for (var ei = 0; ei < eyeSamples.length; ei++) {
      var es = eyeSamples[ei].rgb;
      if (!es) continue;
      var eb = (es[0] + es[1] + es[2]) / 3;
      if (eb >= 30 && eb <= 190) eyeNonRejected.push(es);
    }
    if (eyeNonRejected.length > 3) {
      // Calculate variance across all valid eye samples
      var eAvg = [0,0,0];
      for (var i = 0; i < eyeNonRejected.length; i++) { eAvg[0] += eyeNonRejected[i][0]; eAvg[1] += eyeNonRejected[i][1]; eAvg[2] += eyeNonRejected[i][2]; }
      eAvg[0] /= eyeNonRejected.length; eAvg[1] /= eyeNonRejected.length; eAvg[2] /= eyeNonRejected.length;
      var eVar = 0;
      for (var i = 0; i < eyeNonRejected.length; i++) {
        eVar += Math.pow(eyeNonRejected[i][0] - eAvg[0], 2) + Math.pow(eyeNonRejected[i][1] - eAvg[1], 2) + Math.pow(eyeNonRejected[i][2] - eAvg[2], 2);
      }
      eVar = Math.sqrt(eVar / eyeNonRejected.length);

      // If all eye samples look like skin (no iris found) = likely glasses
      var allSkinLike = true;
      for (var i = 0; i < Math.min(5, eyeNonRejected.length); i++) {
        if (colorDist(eyeNonRejected[i], skinRgb) > 40) { allSkinLike = false; break; }
      }

      // Glasses indicators
      glassesReason = '';

      // Count how many eye samples share the same color temperature as the winner
      // Real iris: small cluster of colored pixels surrounded by white/dark
      // Glasses: MOST pixels have a similar tint (uniform color across lens)
      var winnerIsCool = eyeRgb[2] > eyeRgb[0]; // blue > red
      var winnerIsWarm = eyeRgb[0] > eyeRgb[2] * 1.3;
      var sameAsWinnerCount = 0;
      var totalChecked = 0;
      for (var i = 0; i < eyeNonRejected.length; i++) {
        var eNr = eyeNonRejected[i];
        var eBr = (eNr[0] + eNr[1] + eNr[2]) / 3;
        if (eBr < 30 || eBr > 200) continue; // skip extremes
        totalChecked++;
        if (winnerIsCool && eNr[2] > eNr[0]) sameAsWinnerCount++;
        else if (winnerIsWarm && eNr[0] > eNr[2] * 1.2) sameAsWinnerCount++;
      }
      var uniformRatio = totalChecked > 0 ? sameAsWinnerCount / totalChecked : 0;

      // 1. Uniform tint across eye zone = glasses (>50% of pixels match winner's temperature)
      // Real irises are small — only ~15-25% of eye zone pixels should be iris-colored
      if (uniformRatio > 0.5) {
        eyeObstructed = true;
        glassesReason = 'uniform tint (' + Math.round(uniformRatio*100) + '% of eye zone matches winner color temp)';
      }
      // 2. Low score + all skin-like (opaque dark glasses)
      if (!eyeObstructed && eyeBestScore < 120 && allSkinLike) {
        eyeObstructed = true; glassesReason = 'opaque (low score + all skin-like)';
      }
      // 3. Strong red/amber tint (colored aviators)
      if (!eyeObstructed && eyeRgb[0] > eyeRgb[1] * 1.4 && eyeRgb[0] > eyeRgb[2] * 1.5 && eyeBestScore < 250) {
        eyeObstructed = true; glassesReason = 'red/amber tint (R >> G,B)';
      }
      // 4. Very low variance = solid dark sunglasses
      if (!eyeObstructed && eVar < 8 && eyeBestScore < 150) {
        eyeObstructed = true; glassesReason = 'solid dark lens (very low variance)';
      }
      // 5. Dark/nighttime image — eye color unreliable, skip if auto-brightened significantly
      var adjBrightEl = document.getElementById('adjBright');
      var autoBrightVal = adjBrightEl ? parseInt(adjBrightEl.value) || 0 : 0;
      if (!eyeObstructed && autoBrightVal > 40) {
        // Image was very dark and needed major brightness boost — eye color is unreliable
        // Glasses/no-glasses is indistinguishable in dark screenshots
        eyeObstructed = true; glassesReason = 'dark image (brightness boosted ' + autoBrightVal + ') — eye color unreliable';
      }

      console.log('Glasses uniformity: ' + sameAsWinnerCount + '/' + totalChecked + ' (' + Math.round(uniformRatio*100) + '%) match winner temp, winnerCool=' + winnerIsCool + ' autoBright=' + autoBrightVal);
    }
  }
  console.log('Glasses check: obstructed=' + eyeObstructed + (glassesReason ? ' reason: ' + glassesReason : '') + ' bestScore=' + Math.round(eyeBestScore) + ' variance=' + Math.round(eVar || 0) + ' allSkinLike=' + allSkinLike);

  // Hat detection: sample ABOVE the skin blob (where hat/beanie sits)
  // The hair samples are within the skin blob top — that's forehead, not hat
  // To detect a hat, we need to check what's ABOVE the skin blob
  var hatDetected = false;
  var hatSamples = [];
  var hatCheckY1 = Math.max(0, sb.y1 - Math.round(sh * 0.15));
  var hatCheckY2 = sb.y1;
  if (hatCheckY2 > hatCheckY1 + 3) {
    for (var hy = hatCheckY1; hy < hatCheckY2; hy += Math.max(1, Math.round((hatCheckY2-hatCheckY1)/4))) {
      for (var hxOff = -0.2; hxOff <= 0.2; hxOff += 0.1) {
        var hpx = Math.round(cx + sw * hxOff);
        if (hpx >= 0 && hpx < imgCtx.canvas.width) {
          var pd = imgCtx.getImageData(hpx, hy, 1, 1).data;
          hatSamples.push([pd[0], pd[1], pd[2]]);
        }
      }
    }
  }

  var hatAvgBright = 0, hatAvgR = 0, hatAvgG = 0, hatAvgB = 0, hatVar = 0;
  if (hatSamples.length > 0) {
    for (var i = 0; i < hatSamples.length; i++) {
      hatAvgR += hatSamples[i][0]; hatAvgG += hatSamples[i][1]; hatAvgB += hatSamples[i][2];
      hatAvgBright += (hatSamples[i][0] + hatSamples[i][1] + hatSamples[i][2]) / 3;
    }
    hatAvgR /= hatSamples.length; hatAvgG /= hatSamples.length; hatAvgB /= hatSamples.length;
    hatAvgBright /= hatSamples.length;
    for (var i = 0; i < hatSamples.length; i++) {
      hatVar += Math.pow(hatSamples[i][0]-hatAvgR,2) + Math.pow(hatSamples[i][1]-hatAvgG,2) + Math.pow(hatSamples[i][2]-hatAvgB,2);
    }
    hatVar = Math.sqrt(hatVar / hatSamples.length);

    // Hat = area above skin is dark AND uniform AND very different from skin
    var hatSkinDist = colorDist([hatAvgR, hatAvgG, hatAvgB], skinRgb);
    var hatIsDark = hatAvgBright < 60;
    var hatIsUniform = hatVar < 25;
    var hatIsDiffFromSkin = hatSkinDist > 40;

    // Detect hat if: dark + uniform + different from skin
    if (hatIsDark && hatIsUniform && hatIsDiffFromSkin) hatDetected = true;
    // Also detect if very dark and uniform (solid black beanie)
    if (hatAvgBright < 30 && hatVar < 15) hatDetected = true;

    console.log('Hat zone (above skin): avgBright=' + Math.round(hatAvgBright) + ' variance=' + Math.round(hatVar) + ' skinDist=' + Math.round(hatSkinDist) + ' dark=' + hatIsDark + ' uniform=' + hatIsUniform + ' diffFromSkin=' + hatIsDiffFromSkin + ' hat=' + hatDetected);
  }

  // Also check the hair samples themselves (within skin blob top)
  var hairAvgBright = 0, hairVarCalc = 0;
  if (hairSamples.length > 0) {
    var hairAvgR = 0, hairAvgG = 0, hairAvgB = 0;
    for (var i = 0; i < hairSamples.length; i++) {
      hairAvgBright += (hairSamples[i][0] + hairSamples[i][1] + hairSamples[i][2]) / 3;
      hairAvgR += hairSamples[i][0]; hairAvgG += hairSamples[i][1]; hairAvgB += hairSamples[i][2];
    }
    hairAvgBright /= hairSamples.length;
    hairAvgR /= hairSamples.length; hairAvgG /= hairSamples.length; hairAvgB /= hairSamples.length;
    for (var i = 0; i < hairSamples.length; i++) {
      hairVarCalc += Math.pow(hairSamples[i][0]-hairAvgR,2) + Math.pow(hairSamples[i][1]-hairAvgG,2) + Math.pow(hairSamples[i][2]-hairAvgB,2);
    }
    hairVarCalc = Math.sqrt(hairVarCalc / hairSamples.length);
    console.log('Hair zone (skin blob top): avgBright=' + Math.round(hairAvgBright) + ' variance=' + Math.round(hairVarCalc) + ' avgRGB=(' + Math.round(hairAvgR) + ',' + Math.round(hairAvgG) + ',' + Math.round(hairAvgB) + ')');
  }
  // Also skip hair for very dark images — nighttime lighting makes all hair look brown
  var hairUnreliable = false;
  if (!hatDetected && autoBrightVal > 40) {
    hatDetected = true;
    hairUnreliable = true;
    console.log('DARK IMAGE — hair color unreliable (brightness boosted ' + autoBrightVal + ')');
  }
  if (hatDetected && !hairUnreliable) console.log('HAT DETECTED — skipping hair color');

  // Match colors to swatches (only if not obstructed)
  var skinToneVal = rgbToSkinTone(skinRgb);

  var bestHair = -1; // -1 means not detected
  if (!hatDetected) {
    bestHair = 0;
    var bestHairD = Infinity;
    for (var i = 0; i < HAIR_HEX.length; i++) { var d = colorDist(hairRgb, hexToRgb(HAIR_HEX[i])); if (d < bestHairD) { bestHairD = d; bestHair = i; } }
  }

  var bestEye = -1; // -1 means not detected
  if (!eyeObstructed) {
    bestEye = 0;
    var bestEyeD = Infinity;
    var eyeIsCool = eyeRgb[2] > eyeRgb[0];
    for (var i = 0; i < EYE_HEX.length; i++) {
      var ehex = hexToRgb(EYE_HEX[i]);
      var d = colorDist(eyeRgb, ehex);
      if (eyeIsCool && ehex[2] > ehex[0]) d -= 30;
      if (eyeIsCool && ehex[0] > ehex[2]) d += 20;
      if (d < bestEyeD) { bestEyeD = d; bestEye = i; }
