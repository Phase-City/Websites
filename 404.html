<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05020f;--v:#8b5cf6;--vl:#c4b5fd;--t1:#e2e0ff;--t2:#a5a3c2;--tm:#6b6b87}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 15% 0%,rgba(139,92,246,.09) 0%,transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(6,182,212,.06) 0%,transparent 55%)}
.wrap{position:relative;z-index:1;text-align:center;max-width:560px}
.code{font-family:'JetBrains Mono',monospace;font-size:clamp(80px,18vw,160px);font-weight:700;letter-spacing:.02em;background:linear-gradient(135deg,var(--t1) 0%,var(--v) 50%,#06b6d4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(24px,5vw,36px);color:var(--t1);margin-bottom:12px;letter-spacing:-.01em}
.sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--v);letter-spacing:.35em;text-transform:uppercase;margin-bottom:24px}
.msg{color:var(--t2);font-size:15px;line-height:1.7;margin-bottom:32px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:14px 28px;border-radius:8px;letter-spacing:.04em;text-decoration:none;transition:.3s;display:inline-block}
.btn-p{background:linear-gradient(135deg,var(--v),#6d28d9);color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.25);border:0}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,92,246,.4)}
.btn-o{background:transparent;color:var(--vl);border:1px solid rgba(139,92,246,.35)}
.btn-o:hover{background:rgba(139,92,246,.15);transform:translateY(-2px)}
.foot{margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tm);letter-spacing:.15em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="sub">ERROR — PAGE NOT FOUND</div>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p class="msg">The link you followed is broken, or the page has been moved. Head back to the homepage and try again.</p>
  <div class="btns">
    <a href="/" class="btn btn-p">← BACK TO HOME</a>
    <a href="https://discord.gg/NSZHK6spre" target="_blank" rel="noopener noreferrer" class="btn btn-o">ASK ON DISCORD</a>
  </div>
  <div class="foot">PHASE CITY // phasecity.net</div>
</main>
</body>
